<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Locus — Nicholas Lane</title>
    <meta name="description" content="Plot functions, zoom the plane, and read values under the cursor." />
    <meta name="theme-color" content="#0c0d10" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0c0d10;
        --surface: #14161b;
        --elevated: #1c2028;
        --fg: #eceef2;
        --muted: #8b919c;
        --subtle: #5c636e;
        --accent: #8eb4c4;
        --border: #2a3140;
        --canvas: #101218;
        --grid: #1c212a;
        --grid-major: #2a3140;
        --axis: #6a7382;
        --font-sans: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
        --font-display: "Instrument Serif", Georgia, serif;
        --font-mono: "IBM Plex Mono", ui-monospace, monospace;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-sans); }
      body { display: flex; flex-direction: column; }
      header {
        display: flex; align-items: center; justify-content: space-between;
        height: 44px; padding: 0 12px; border-bottom: 1px solid var(--border); background: var(--surface);
      }
      header a { color: var(--muted); text-decoration: none; font-size: 0.875rem; min-height: 44px; display: inline-flex; align-items: center; }
      header a:hover { color: var(--fg); }
      header strong { font-family: var(--font-display); font-style: italic; font-weight: 400; font-size: 1.15rem; }
      .stage { flex: 1; min-height: 0; display: flex; flex-direction: column; }
      canvas { display: block; width: 100%; height: 100%; cursor: crosshair; touch-action: none; background: var(--canvas); }
      .plot { position: relative; flex: 1; min-height: 0; }
      aside {
        border-top: 1px solid var(--border); background: var(--surface);
        max-height: 38vh; display: flex; flex-direction: column;
      }
      .panel { padding: 12px 16px 16px; overflow: auto; }
      label { display: block; font-size: 0.75rem; color: var(--muted); margin-bottom: 6px; }
      .row { display: flex; gap: 8px; }
      input[type="text"] {
        flex: 1; min-height: 44px; border: 0; border-radius: 10px; background: var(--elevated);
        color: var(--fg); font-family: var(--font-mono); font-size: 0.9rem; padding: 0 12px 0 36px;
      }
      .yeq { position: relative; flex: 1; }
      .yeq span { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-family: var(--font-mono); color: var(--subtle); font-size: 0.875rem; pointer-events: none; }
      button {
        min-height: 44px; min-width: 44px; border: 0; border-radius: 10px; background: var(--elevated);
        color: var(--fg); font: 500 0.875rem var(--font-sans); cursor: pointer;
      }
      .examples { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
      .examples button { min-height: 36px; padding: 0 10px; color: var(--muted); }
      .err { min-height: 1.2em; margin: 8px 0 0; font-size: 0.8rem; color: #d48a8a; }
      .readout { position: absolute; left: 12px; bottom: 12px; font-family: var(--font-mono); font-size: 0.75rem; color: var(--muted); background: rgb(16 18 24 / 0.82); padding: 6px 8px; border-radius: 8px; }
      @media (min-width: 900px) {
        .stage { flex-direction: row; }
        aside { max-height: none; width: 20rem; border-top: 0; border-left: 1px solid var(--border); }
        .brand-lg { display: block; font-family: var(--font-display); font-style: italic; font-size: 2rem; margin: 8px 0 4px; }
        .sub { color: var(--muted); font-size: 0.875rem; margin: 0 0 16px; }
      }
      @media (max-width: 899px) { .brand-lg, .sub { display: none; } }
    </style>
  </head>
  <body>
    <header>
      <a href="./index.html">← Portfolio</a>
      <strong>Locus</strong>
    </header>
    <div class="stage">
      <div class="plot">
        <canvas id="c" aria-label="Function graph. Drag to pan, scroll to zoom."></canvas>
        <div class="readout" id="hud">x — &nbsp; y —</div>
      </div>
      <aside>
        <div class="panel">
          <p class="brand-lg">Locus</p>
          <p class="sub">Plot functions on the plane.</p>
          <label for="expr">Function</label>
          <div class="row">
            <div class="yeq">
              <span>y=</span>
              <input id="expr" type="text" value="sin(x)" spellcheck="false" autocomplete="off" />
            </div>
            <button type="button" id="plot">Plot</button>
          </div>
          <p class="err" id="err"></p>
          <div class="examples" id="examples"></div>
        </div>
      </aside>
    </div>
    <script>
      const NAMES = { sin: "Math.sin", cos: "Math.cos", tan: "Math.tan", abs: "Math.abs", sqrt: "Math.sqrt", log: "Math.log10", ln: "Math.log", exp: "Math.exp", pi: "Math.PI", e: "Math.E" };
      function compile(src) {
        const raw = src.trim().toLowerCase();
        if (!raw) throw new Error("Enter an expression.");
        if (!/^[0-9a-z+\-*/^().,|\s]+$/.test(raw)) throw new Error("Use numbers, x, and standard functions.");
        let s = raw.replace(/\s+/g, "");
        s = s.replace(/\|([^|]+)\|/g, "abs($1)");
        s = s.replace(/(\d)(x|\()/g, "$1*$2");
        s = s.replace(/(x|\))(\()/g, "$1*$2");
        s = s.replace(/(x|\))(\d)/g, "$1*$2");
        s = s.replace(/(\))(x)/g, "$1*$2");
        s = s.replace(/\^/g, "**");
        s = s.replace(/\b([a-z]+)\b/g, (m) => (m === "x" ? "x" : NAMES[m] || null));
        if (s.includes("null")) throw new Error("Unknown name in expression.");
        const fn = new Function("x", `"use strict"; return (${s});`);
        const t = fn(0.5);
        if (typeof t !== "number") throw new Error("Expression must return a number.");
        return fn;
      }
      const view = { cx: 0, cy: 0, span: 16 };
      const canvas = document.getElementById("c");
      const hud = document.getElementById("hud");
      const err = document.getElementById("err");
      let fn = compile("sin(x)");
      let color = "#8eb4c4";
      function size() {
        const r = canvas.parentElement.getBoundingClientRect();
        const dpr = Math.min(devicePixelRatio || 1, 2);
        canvas.width = Math.floor(r.width * dpr);
        canvas.height = Math.floor(r.height * dpr);
        canvas.style.width = r.width + "px";
        canvas.style.height = r.height + "px";
        return { w: r.width, h: r.height, dpr };
      }
      function world(px, py, w, h) {
        const s = view.span / w;
        return { x: view.cx + (px - w / 2) * s, y: view.cy - (py - h / 2) * s };
      }
      function screen(x, y, w, h) {
        const s = w / view.span;
        return { x: (x - view.cx) * s + w / 2, y: (view.cy - y) * s + h / 2 };
      }
      function nice(span, w) {
        const raw = (span / w) * 80;
        const pow = Math.pow(10, Math.floor(Math.log10(raw)));
        const n = raw / pow;
        const step = n < 1.5 ? 1 : n < 3.5 ? 2 : n < 7.5 ? 5 : 10;
        return step * pow;
      }
      function draw() {
        const { w, h, dpr } = size();
        const ctx = canvas.getContext("2d");
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.fillStyle = "#101218";
        ctx.fillRect(0, 0, w, h);
        const step = nice(view.span, w);
        const major = step * 5;
        const tl = world(0, 0, w, h), br = world(w, h, w, h);
        const x0 = Math.floor(tl.x / step) * step, y0 = Math.floor(br.y / step) * step;
        ctx.lineWidth = 1;
        for (let x = x0; x <= br.x + step; x += step) {
          const p = screen(x, 0, w, h);
          ctx.strokeStyle = Math.abs(x % major) < step / 4 ? "#2a3140" : "#1c212a";
          ctx.beginPath(); ctx.moveTo(p.x, 0); ctx.lineTo(p.x, h); ctx.stroke();
        }
        for (let y = y0; y <= tl.y + step; y += step) {
          const p = screen(0, y, w, h);
          ctx.strokeStyle = Math.abs(y % major) < step / 4 ? "#2a3140" : "#1c212a";
          ctx.beginPath(); ctx.moveTo(0, p.y); ctx.lineTo(w, p.y); ctx.stroke();
        }
        const o = screen(0, 0, w, h);
        ctx.strokeStyle = "#6a7382";
        ctx.beginPath(); ctx.moveTo(0, o.y); ctx.lineTo(w, o.y); ctx.moveTo(o.x, 0); ctx.lineTo(o.x, h); ctx.stroke();
        ctx.fillStyle = "#8b919c";
        ctx.font = "11px IBM Plex Mono, monospace";
        for (let x = x0; x <= br.x + step; x += major) {
          if (Math.abs(x) < step / 4) continue;
          const p = screen(x, 0, w, h);
          ctx.fillText(String(+x.toPrecision(6)), p.x + 4, Math.min(h - 6, Math.max(12, o.y - 6)));
        }
        ctx.strokeStyle = color;
        ctx.lineWidth = 1.75;
        ctx.beginPath();
        let started = false;
        for (let i = 0; i <= w; i++) {
          const x = world(i, 0, w, h).x;
          let y;
          try { y = fn(x); } catch { y = NaN; }
          if (!Number.isFinite(y)) { started = false; continue; }
          const p = screen(x, y, w, h);
          if (!started) { ctx.moveTo(p.x, p.y); started = true; } else ctx.lineTo(p.x, p.y);
        }
        ctx.stroke();
      }
      function apply() {
        const src = document.getElementById("expr").value;
        try { fn = compile(src); err.textContent = ""; draw(); }
        catch (e) { err.textContent = e.message; }
      }
      const examples = [["sin(x)", "Sine"], ["x^2", "Parabola"], ["abs(x)", "Absolute"], ["sin(x)/x", "Sinc"]];
      const ex = document.getElementById("examples");
      for (const [v, l] of examples) {
        const b = document.createElement("button");
        b.type = "button"; b.textContent = l;
        b.addEventListener("click", () => { document.getElementById("expr").value = v; apply(); });
        ex.appendChild(b);
      }
      document.getElementById("plot").addEventListener("click", apply);
      document.getElementById("expr").addEventListener("keydown", (e) => { if (e.key === "Enter") apply(); });
      let pan = null;
      canvas.addEventListener("pointerdown", (e) => { pan = { x: e.clientX, y: e.clientY }; canvas.setPointerCapture(e.pointerId); });
      canvas.addEventListener("pointerup", () => { pan = null; });
      canvas.addEventListener("pointermove", (e) => {
        const r = canvas.getBoundingClientRect();
        const pt = world(e.clientX - r.left, e.clientY - r.top, r.width, r.height);
        let yv = "—";
        try { const y = fn(pt.x); if (Number.isFinite(y)) yv = y.toFixed(3); } catch {}
        hud.textContent = `x ${pt.x.toFixed(3)}   y ${yv}`;
        if (!pan) return;
        const s = view.span / r.width;
        view.cx -= (e.clientX - pan.x) * s;
        view.cy += (e.clientY - pan.y) * s;
        pan = { x: e.clientX, y: e.clientY };
        draw();
      });
      canvas.addEventListener("wheel", (e) => {
        e.preventDefault();
        const r = canvas.getBoundingClientRect();
        const before = world(e.clientX - r.left, e.clientY - r.top, r.width, r.height);
        view.span *= e.deltaY > 0 ? 1.12 : 0.88;
        view.span = Math.min(400, Math.max(0.5, view.span));
        const after = world(e.clientX - r.left, e.clientY - r.top, r.width, r.height);
        view.cx += before.x - after.x;
        view.cy += before.y - after.y;
        draw();
      }, { passive: false });
      addEventListener("resize", draw);
      draw();
    </script>
  </body>
</html>
