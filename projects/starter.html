<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Starter check</title><style>body{margin:0;font-family:sans-serif;background:#16130f;color:#f4efe6}main{padding:14px}button{font:inherit;margin-right:8px;border:0;border-radius:8px;padding:8px 12px;background:#c47a2c;color:#1c1915;cursor:pointer}.lamp{width:18px;height:18px;border-radius:50%;display:inline-block;background:#3c342b;vertical-align:middle}.on{background:#d7a441;box-shadow:0 0 12px #d7a441}p{line-height:1.45}</style></head><body><main><p>Stop is a normally closed contact. Start is momentary. OL is closed when the overload is healthy.</p><p>Coil <span id="lamp" class="lamp"></span> <strong id="state">off</strong></p><button id="start">Start</button><button id="stop">Stop</button><button id="ol">Trip overload</button><p id="why"></p></main><script>let seal=false,stopClosed=true,olClosed=true;const lamp=document.querySelector("#lamp");function tick(){const coil=stopClosed&&olClosed&&seal;if(!coil)seal=false;lamp.className="lamp"+(coil?" on":"");state.textContent=coil?"on — seal-in holding":"off";why.textContent=!stopClosed?"Stop is open.":!olClosed?"Overload is tripped. Reset it before start.":coil?"M contact is feeding the coil around the start button.":"Press start."}start.onclick=()=>{seal=true;tick()};stop.onclick=()=>{stopClosed=!stopClosed;stop.textContent=stopClosed?"Stop":"Release stop";if(!stopClosed)seal=false;tick()};ol.onclick=()=>{olClosed=!olClosed;ol.textContent=olClosed?"Trip overload":"Reset overload";if(!olClosed)seal=false;tick()};tick();</script></body></html>
