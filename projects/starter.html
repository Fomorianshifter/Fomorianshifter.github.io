<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Motor starter — Nicholas Lane</title><link rel="stylesheet" href="../styles.css"></head>
<body>
<header class="top"><a class="mark" href="../index.html">NL</a><nav><a href="../index.html#labs">Labs</a></nav></header>
<main>
  <h1>Three-wire motor starter</h1>
  <p>Stop is normally closed. Start is momentary. The aux contact seals the coil in after start.</p>
  <div class="panel">
    <div class="rung"><span>L1</span><span class="contact on" id="stop">STOP NC</span><span class="contact" id="start">START</span><span class="contact" id="aux">M aux</span><span class="coil" id="coil">M</span><span>L2</span></div>
    <button type="button" id="press">Press start</button>
    <button type="button" id="release">Release start</button>
    <button type="button" id="hitstop">Hit stop</button>
    <p id="state">Coil de-energized.</p>
  </div>
</main>
<script>
let sealed = false, starting = false, stopped = false;
function draw() {
  const on = !stopped && (starting || sealed);
  sealed = on && !starting ? true : on;
  if (stopped) sealed = false;
  coil.className = "coil" + (on ? " on" : "");
  aux.className = "contact" + (on ? " on" : "");
  start.className = "contact" + (starting ? " on" : "");
  stop.className = "contact" + (stopped ? "" : " on");
  state.textContent = on ? "Coil sealed in. Motor contactor is picked up." : "Coil de-energized.";
}
press.onclick = () => { stopped = false; starting = true; draw(); };
release.onclick = () => { starting = false; draw(); };
hitstop.onclick = () => { stopped = true; starting = false; sealed = false; draw(); };
draw();
</script>
</body></html>
