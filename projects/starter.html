<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Three-wire starter — Nicholas Lane</title><link rel="stylesheet" href="../styles.css"></head>
<body><header><nav><a href="../index.html">Home</a></nav>
<p class="kicker">Lab · PLC path</p><h1>Three-wire starter</h1>
<p>Stop is normally closed. Start is normally open. The seal-in contact holds the coil after start is released. Overload opens the rung.</p></header>
<main>
<div class="row">
<button type="button" id="stop">Stop closed</button>
<button type="button" id="start">Start open</button>
<button type="button" id="ol">Overload closed</button>
</div>
<p id="state" class="meta">Coil: off</p>
<div class="coil" id="coil">M</div>
<pre id="rung" class="card"></pre>
</main>
<script>
const stop=document.getElementById('stop'), start=document.getElementById('start'), ol=document.getElementById('ol');
let stopClosed=true, startOn=false, olClosed=true, seal=false;
function draw(){
  const coil = stopClosed && olClosed && (startOn || seal);
  seal = coil;
  document.getElementById('coil').className = coil ? 'coil on' : 'coil';
  document.getElementById('state').textContent = coil ? 'Coil: energized, seal-in closed' : 'Coil: off';
  stop.textContent = stopClosed ? 'Stop closed' : 'Stop open';
  start.textContent = startOn ? 'Start held' : 'Start open';
  ol.textContent = olClosed ? 'Overload closed' : 'Overload tripped';
  document.getElementById('rung').textContent = 'L1 --[Stop '+(stopClosed?'X':'/')+']--[Start '+(startOn?'X':'/')+']--+--(M)-- L2\n              |                      |\n              +----[seal '+(seal?'X':'/')+']----+--[OL '+(olClosed?'X':'/')+']';
}
stop.onclick=()=>{stopClosed=!stopClosed; if(!stopClosed) seal=false; draw();};
start.onmousedown=()=>{startOn=true; draw();};
start.onmouseup=()=>{startOn=false; draw();};
ol.onclick=()=>{olClosed=!olClosed; if(!olClosed) seal=false; draw();};
draw();
</script></body></html>
