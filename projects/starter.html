<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Three-wire starter — Nicholas Lane</title>
<link rel="stylesheet" href="../styles.css">
</head>
<body>
<main>
<p><a href="../index.html">← Portfolio</a></p>
<h1>Three-wire starter</h1>
<p class="note">Stop, start, seal-in contact, and overload. Study model, not a panel drawing.</p>
<div class="lab">
  <button type="button" id="start">Start</button>
  <button type="button" id="stop">Stop</button>
  <button type="button" id="ol">Trip overload</button>
  <pre class="out" id="rung"></pre>
  <p id="motor"></p>
</div>
<script>
var run = false, ol = false;
function draw() {
  var seal = run ? "M closed" : "M open";
  var coil = run ? "M ON" : "M off";
  document.getElementById("rung").textContent =
    "|--[ stop ]--[ start ]--+--( " + coil + " )--|   OL: " + (ol ? "TRIP" : "ok") + "\n" +
    "                       |\n" +
    "                       +----[ " + seal + " ]----+";
  document.getElementById("motor").textContent = "Motor: " + (run ? "running" : "off");
}
document.getElementById("start").onclick = function () { if (!ol) run = true; draw(); };
document.getElementById("stop").onclick = function () { run = false; draw(); };
document.getElementById("ol").onclick = function () { ol = !ol; if (ol) run = false; draw(); };
draw();
</script>
</main>
</body>
</html>
