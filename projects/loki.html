<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Loki life — Nicholas Lane</title><link rel="stylesheet" href="../styles.css"></head>
<body>
<header class="top"><a class="mark" href="../index.html">NL</a><nav><a href="../index.html#projects">Projects</a></nav></header>
<main>
  <h1>Loki life-cycle</h1>
  <p>Same thresholds as loki_life.c: egg, hatchling at 50 gp, young at 200, adult at 500. Hunger rises each tick.</p>
  <div class="panel">
    <p class="out" id="face">egg</p>
    <p id="stat"></p>
    <button type="button" id="basic">Feed basic</button>
    <button type="button" id="tasty">Feed tasty</button>
    <button type="button" id="tick">Tick</button>
  </div>
  <p><a href="https://github.com/Fomorianshifter/Loki">Loki repository</a></p>
</main>
<script>
const s = {hunger:40, happy:50, energy:70, gp:0};
function stage() { return s.gp>=500?"adult":s.gp>=200?"young":s.gp>=50?"hatchling":"egg"; }
function mood() {
  if (s.hunger>=70) return "hungry";
  if (s.energy<=20) return "sleepy";
  if (s.happy<=30 || s.hunger>=50) return "grumpy";
  if (s.happy>=70) return "happy";
  if (s.happy>=50 && s.energy>=60) return "playful";
  return "neutral";
}
function feed(h,g,p) {
  const pen = s.hunger<30 ? 0.5 : 1;
  s.hunger = Math.max(0, s.hunger - h*pen);
  s.gp += g*pen; s.happy = Math.min(100, s.happy + p*pen);
  draw();
}
function draw() {
  face.textContent = stage() + " · " + mood();
  stat.textContent = `hunger ${s.hunger.toFixed(0)} · happiness ${s.happy.toFixed(0)} · energy ${s.energy.toFixed(0)} · growth ${s.gp.toFixed(0)}`;
}
basic.onclick = () => feed(20,5,5);
tasty.onclick = () => feed(40,10,15);
tick.onclick = () => {
  if (mood()==="sleepy") s.energy = Math.min(100, s.energy+15);
  else s.energy = Math.max(0, s.energy-8);
  s.hunger = Math.min(100, s.hunger+10);
  s.happy = Math.max(0, s.happy-3);
  draw();
};
draw();
</script>
</body></html>
