<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loki life cycle — Nicholas Lane</title>
  <link rel="stylesheet" href="../styles.css">
</head>
<body>
  <header>
    <strong>Loki life cycle</strong>
    <nav><a href="../index.html">Home</a> <a href="https://github.com/Fomorianshifter/Loki">Repo</a></nav>
  </header>
  <main>
    <section>
      <p class="note">Browser stand-in for the egg-to-adult rules in Loki: 50, 200, and 500 growth points. Not the device firmware.</p>
      <div class="card">
        <h2 id="stage">Egg</h2>
        <p id="mood">Mood: neutral · hunger 20 · energy 80 · gp 0</p>
        <p>
          <button class="action" data-food="basic">Basic feed</button>
          <button class="action" data-food="tasty">Tasty feed</button>
          <button class="action" id="play" type="button">Interact</button>
          <button class="action" id="tick" type="button">Tick</button>
        </p>
      </div>
    </section>
  </main>
  <script>
    const s = { hunger: 20, happy: 50, energy: 80, gp: 0 };
    const foods = { basic: [20, 5, 5], tasty: [40, 10, 15] };
    function stage() {
      if (s.gp >= 500) return "Adult";
      if (s.gp >= 200) return "Young";
      if (s.gp >= 50) return "Hatchling";
      return "Egg";
    }
    function mood() {
      if (s.hunger >= 70) return "hungry";
      if (s.energy <= 20) return "sleepy";
      if (s.happy <= 30 || s.hunger >= 50) return "grumpy";
      if (s.happy >= 70) return "happy";
      if (s.happy >= 50 && s.energy >= 60) return "playful";
      return "neutral";
    }
    function paint() {
      document.getElementById("stage").textContent = stage();
      document.getElementById("mood").textContent = `Mood: ${mood()} · hunger ${s.hunger} · energy ${s.energy} · happiness ${s.happy} · gp ${s.gp}`;
    }
    document.querySelector(".card").onclick = (e) => {
      const food = e.target.dataset.food;
      if (food) {
        const [h, g, p] = foods[food];
        const half = s.hunger < 25 ? 0.5 : 1;
        s.hunger = Math.max(0, s.hunger - h * half);
        s.gp += g * half;
        s.happy = Math.min(100, s.happy + p * half);
      }
      if (e.target.id === "play") {
        s.happy = Math.min(100, s.happy + 12);
        s.energy = Math.max(0, s.energy - 8);
        s.gp += 4;
      }
      if (e.target.id === "tick") {
        if (mood() === "sleepy") s.energy = Math.min(100, s.energy + 15);
        else s.energy = Math.max(0, s.energy - 6);
        s.hunger = Math.min(100, s.hunger + 8);
      }
      paint();
    };
    paint();
  </script>
</body>
</html>
