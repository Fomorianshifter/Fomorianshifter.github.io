<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Loki status</title><style>body{margin:0;font-family:sans-serif;background:#16130f;color:#f4efe6}main{padding:14px}button{font:inherit;margin-right:8px;border:0;border-radius:8px;padding:8px 12px;background:#c47a2c;color:#1c1915;cursor:pointer}.bar{height:8px;background:#3c342b;border-radius:99px;margin:6px 0 12px}.bar span{display:block;height:8px;background:#d7a441;border-radius:99px}</style></head><body><main><h1 id="stage" style="font-size:22px;margin:0 0 8px">Egg</h1><div>Hunger <div class="bar"><span id="hunger"></span></div></div><div>Happiness <div class="bar"><span id="happy"></span></div></div><div>Energy <div class="bar"><span id="energy"></span></div></div><p id="mood"></p><button id="feed">Feed</button><button id="play">Interact</button><button id="tick">Pass an hour</button></main><script>const s={gp:0,hunger:40,happy:50,energy:70};function stage(){return s.gp>=500?"Adult":s.gp>=200?"Young":s.gp>=50?"Hatchling":"Egg"}function mood(){if(s.hunger>=70)return "Hungry";if(s.energy<=20)return "Sleepy";if(s.happy<=30)return "Grumpy";if(s.happy>=70)return "Happy";if(s.happy>=50&&s.energy>=60)return "Playful";return "Neutral"}function draw(){document.querySelector("#stage").textContent=stage()+" · "+s.gp+" gp";hunger.style.width=s.hunger+"%";happy.style.width=s.happy+"%";energy.style.width=s.energy+"%";document.querySelector("#mood").textContent="Mood: "+mood()}const clamp=n=>Math.max(0,Math.min(100,n));feed.onclick=()=>{s.hunger=clamp(s.hunger-30);s.happy=clamp(s.happy+10);s.gp+=8;draw()};play.onclick=()=>{s.happy=clamp(s.happy+15);s.energy=clamp(s.energy-12);s.gp+=6;draw()};tick.onclick=()=>{s.hunger=clamp(s.hunger+12);s.energy=clamp(s.energy-10);draw()};draw();</script></body></html>
