<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbit — Nicholas Lane</title><link rel="stylesheet" href="../styles.css"></head>
<body><header><nav><a class="brand" href="../index.html">NL</a><a href="../index.html#projects">Projects</a></nav>
<div class="hero"><p class="kicker">From SolarSystem / Mynewproject-SolarSystem</p><h1>Planets in orbit</h1>
<p class="lede">A small canvas rewrite of the public planet repos. Distances and sizes are illustrative, not to scale.</p></div></header>
<main><section class="card"><canvas id="sky" width="960" height="420"></canvas>
<p class="meta"><a href="https://github.com/Fomorianshifter/SolarSystem">SolarSystem</a> · <a href="https://github.com/Fomorianshifter/Mynewproject-SolarSystem">Mynewproject-SolarSystem</a></p></section></main>
<script>
const c = document.getElementById("sky"); const ctx = c.getContext("2d");
const planets = [
  { r: 46, s: 3, hue: 28, w: 0.04 }, { r: 70, s: 5, hue: 42, w: 0.028 },
  { r: 96, s: 5, hue: 200, w: 0.022 }, { r: 122, s: 4, hue: 12, w: 0.018 },
  { r: 160, s: 11, hue: 32, w: 0.01 }, { r: 198, s: 9, hue: 45, w: 0.007 }
];
let t = 0;
function frame() {
  const w = c.width, h = c.height, cx = w / 2, cy = h / 2;
  ctx.fillStyle = "#0b0d09"; ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = "#e2a23a"; ctx.beginPath(); ctx.arc(cx, cy, 16, 0, Math.PI * 2); ctx.fill();
  planets.forEach(p => {
    ctx.strokeStyle = "#3a382c"; ctx.beginPath(); ctx.ellipse(cx, cy, p.r, p.r * 0.42, 0, 0, Math.PI * 2); ctx.stroke();
    const a = t * p.w, x = cx + Math.cos(a) * p.r, y = cy + Math.sin(a) * p.r * 0.42;
    ctx.fillStyle = "hsl(" + p.hue + " 60% 55%)"; ctx.beginPath(); ctx.arc(x, y, p.s, 0, Math.PI * 2); ctx.fill();
  });
  t += 1; requestAnimationFrame(frame);
}
frame();
</script></body></html>
