</div>
<p><a href="../index.html">Back to portfolio</a></p></main><footer>Nicholas Lane · lab for LinkedIn</footer>
<script>
function orbit(id, radius, seconds) {
  const el = document.getElementById(id);
  const start = performance.now();
  function frame(now) {
    const angle = ((now - start) / 1000 / seconds) * Math.PI * 2;
    el.style.left = (50 + Math.cos(angle) * radius) + "%";
    el.style.top = (50 + Math.sin(angle) * radius) + "%";
    el.style.transform = "translate(-50%,-50%)";
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}
orbit("p1", 16, 4); orbit("p2", 28, 7); orbit("p3", 40, 11);
</script></body></html>
