<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Orbits — Nicholas Lane</title>
  <link rel="stylesheet" href="../styles.css" />
</head>
<body>
  <header class="top"><a class="mark" href="../index.html">NL</a><nav><a href="../index.html#labs">Projects</a></nav></header>
  <main class="lab">
    <h1>Orbits</h1>
    <p>A clickable lab for the <a href="https://github.com/Fomorianshifter/SolarSystem">Solar System</a> repo. Periods are fixed so the motion is readable, not to scale.</p>
    <canvas id="sky" width="800" height="420"></canvas>
  </main>
  <script>
    const c = document.getElementById("sky");
    const ctx = c.getContext("2d");
    const planets = [
      { r: 50, t: 4, color: "#c4b7a6", size: 4 },
      { r: 80, t: 7, color: "#d2a15a", size: 6 },
      { r: 118, t: 10, color: "#7ea0c4", size: 6 },
      { r: 160, t: 14, color: "#c46b4a", size: 5 }
    ];
    const t0 = performance.now();
    function frame(now) {
      const s = (now - t0) / 1000;
      ctx.clearRect(0, 0, c.width, c.height);
      ctx.fillStyle = "#0b0f0c";
      ctx.fillRect(0, 0, c.width, c.height);
      const cx = 400, cy = 210;
      ctx.fillStyle = "#d2a15a";
      ctx.beginPath();
      ctx.arc(cx, cy, 14, 0, Math.PI * 2);
      ctx.fill();
      planets.forEach((p) => {
        ctx.strokeStyle = "#2a3328";
        ctx.beginPath();
        ctx.ellipse(cx, cy, p.r, p.r * 0.42, 0, 0, Math.PI * 2);
        ctx.stroke();
        const a = (s / p.t) * Math.PI * 2;
        const x = cx + Math.cos(a) * p.r;
        const y = cy + Math.sin(a) * p.r * 0.42;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(x, y, p.size, 0, Math.PI * 2);
        ctx.fill();
      });
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
