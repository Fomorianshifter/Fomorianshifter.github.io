<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Orbit lab</title>
  <link rel="stylesheet" href="../styles.css" />
</head>
<body>
  <header class="nav"><a class="mark" href="/">NL</a><nav><a href="/">Home</a></nav></header>
  <div class="lab-wrap">
    <h1>Orbit lab</h1>
    <p class="muted">Minimal solar-system demo for the portfolio. Same idea as the SolarSystem GitHub repo.</p>
    <canvas id="c" width="680" height="420"></canvas>
  </div>
  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const planets = [
      { r: 40, size: 4, speed: 0.028, color: '#c9a27a' },
      { r: 70, size: 6, speed: 0.018, color: '#7ad0a5' },
      { r: 105, size: 7, speed: 0.012, color: '#8bb4ff' },
      { r: 145, size: 5, speed: 0.008, color: '#e08b6f' },
      { r: 185, size: 10, speed: 0.005, color: '#d7b56a' }
    ];
    let t = 0;
    function draw() {
      const cx = canvas.width / 2, cy = canvas.height / 2;
      ctx.fillStyle = '#0b0f14';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#ffd36a';
      ctx.beginPath(); ctx.arc(cx, cy, 14, 0, Math.PI * 2); ctx.fill();
      planets.forEach((p) => {
        ctx.strokeStyle = '#243042';
        ctx.beginPath(); ctx.arc(cx, cy, p.r, 0, Math.PI * 2); ctx.stroke();
        const a = t * p.speed;
        const x = cx + Math.cos(a) * p.r;
        const y = cy + Math.sin(a) * p.r * 0.62;
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(x, y, p.size, 0, Math.PI * 2); ctx.fill();
      });
      t += 1;
      requestAnimationFrame(draw);
    }
    draw();
  </script>
</body>
</html>
