<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbit sketch — Nicholas Lane</title><link rel="stylesheet" href="../styles.css"></head>
<body>
<header class="site"><div class="wrap nav"><a class="brand" href="../index.html">NL · Lane</a><a href="../index.html#projects">Projects</a></div></header>
<main class="wrap"><section>
<p class="kicker">Browser sketch</p><h1>Orbit sketch</h1>
<p class="lede">The public Solar System repo is a title and a license. This page is the working sketch: circular orbits, no physics claims.</p>
<div class="canvas-wrap"><canvas id="sky" width="960" height="540"></canvas></div>
</section></main>
<script>
const c = document.getElementById("sky"), ctx = c.getContext("2d");
const bodies = [{r:70,size:4,color:"#c4b6a6",w:0.02},{r:110,size:7,color:"#e0c07a",w:0.014},{r:150,size:8,color:"#6ea8d4",w:0.011},{r:190,size:6,color:"#c46b4a",w:0.009},{r:250,size:16,color:"#d7b48a",w:0.005}];
let t = 0;
function frame(){
  ctx.fillStyle = "#14110e"; ctx.fillRect(0,0,c.width,c.height);
  const cx = c.width/2, cy = c.height/2;
  ctx.beginPath(); ctx.fillStyle = "#f2c14e"; ctx.arc(cx,cy,22,0,Math.PI*2); ctx.fill();
  bodies.forEach(b => {
    ctx.beginPath(); ctx.strokeStyle = "#3a332c"; ctx.arc(cx,cy,b.r,0,Math.PI*2); ctx.stroke();
    const a = t * b.w, x = cx + Math.cos(a)*b.r, y = cy + Math.sin(a)*b.r*0.42;
    ctx.beginPath(); ctx.fillStyle = b.color; ctx.arc(x,y,b.size,0,Math.PI*2); ctx.fill();
  });
  t += 1; requestAnimationFrame(frame);
}
frame();
</script></body></html>
