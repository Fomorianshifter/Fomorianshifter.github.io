<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Orbits — Nicholas Lane</title>
  <link rel="stylesheet" href="../styles.css" />
</head>
<body>
  <header class="top"><a class="mark" href="../index.html">NL</a><nav><a href="../index.html">Home</a></nav></header>
  <main>
    <h1>Orbits</h1>
    <p class="note">Browser version of the 2024 Solar System sketch. Periods are illustrative, not ephemeris data.</p>
    <canvas id="sky" width="640" height="420" style="width:100%;background:#100e0b;border:1px solid #3a342c"></canvas>
    <p><a href="https://github.com/Fomorianshifter/SolarSystem">SolarSystem repo</a></p>
  </main>
  <script>
    const c = document.getElementById("sky");
    const g = c.getContext("2d");
    const planets = [
      { name: "Mercury", r: 50, p: 4, color: "#c4b7a6" },
      { name: "Venus", r: 80, p: 7, color: "#e2a14a" },
      { name: "Earth", r: 115, p: 10, color: "#7eb0d4" },
      { name: "Mars", r: 150, p: 16, color: "#c46b4a" }
    ];
    const t0 = performance.now();
    function frame(now) {
      const t = (now - t0) / 1000;
      g.clearRect(0, 0, c.width, c.height);
      g.fillStyle = "#e7e1d6";
      g.beginPath();
      g.arc(320, 210, 10, 0, Math.PI * 2);
      g.fill();
      for (const p of planets) {
        g.strokeStyle = "#3a342c";
        g.beginPath();
        g.ellipse(320, 210, p.r, p.r * 0.62, 0, 0, Math.PI * 2);
        g.stroke();
        const a = (t / p.p) * Math.PI * 2;
        const x = 320 + Math.cos(a) * p.r;
        const y = 210 + Math.sin(a) * p.r * 0.62;
        g.fillStyle = p.color;
        g.beginPath();
        g.arc(x, y, 6, 0, Math.PI * 2);
        g.fill();
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
