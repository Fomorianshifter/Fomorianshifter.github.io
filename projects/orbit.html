<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Orbits lab</title><link rel="stylesheet" href="../styles.css"></head>
<body><header><a href="../index.html">Nicholas Lane</a></header>
<main class="wrap"><section class="hero"><div class="kicker">From the Solar System repos</div><h1>Planets in orbit</h1>
<p class="lede">Canvas stand-in for <a href="https://github.com/Fomorianshifter/Mynewproject-SolarSystem">Mynewproject-SolarSystem</a>. Periods are illustrative.</p>
<canvas id="sky" width="900" height="420"></canvas></section></main>
<script>
var canvas = document.getElementById("sky"), ctx = canvas.getContext("2d");
var bodies = [{r:50,period:4,color:"#c4b7a6",size:4},{r:80,period:7,color:"#e0c07a",size:6},{r:116,period:10,color:"#7eb6d9",size:6},{r:154,period:16,color:"#d47a55",size:5}];
var t0 = performance.now();
function frame(now) {
  var t = (now - t0) / 1000, w = canvas.width, h = canvas.height, cx = w/2, cy = h/2;
  ctx.fillStyle = "#0b100c"; ctx.fillRect(0,0,w,h);
  ctx.fillStyle = "#d4a017"; ctx.beginPath(); ctx.arc(cx, cy, 14, 0, Math.PI*2); ctx.fill();
  bodies.forEach(function (b) {
    ctx.strokeStyle = "#2d3a2a"; ctx.beginPath(); ctx.ellipse(cx, cy, b.r, b.r*0.62, 0, 0, Math.PI*2); ctx.stroke();
    var a = (t / b.period) * Math.PI * 2;
    ctx.fillStyle = b.color; ctx.beginPath(); ctx.arc(cx + Math.cos(a)*b.r, cy + Math.sin(a)*b.r*0.62, b.size, 0, Math.PI*2); ctx.fill();
  });
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script></body></html>
