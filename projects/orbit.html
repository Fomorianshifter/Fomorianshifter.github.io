<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Orbits — Nicholas Lane</title><link rel="stylesheet" href="../styles.css"></head>
<body>
<header class="top"><a class="mark" href="../index.html">NL</a><nav><a href="../index.html#projects">Projects</a></nav></header>
<main>
  <h1>Solar system</h1>
  <p>Rebuilt from the 2024 Solar System repos. Drag to pause is not required — it just runs.</p>
  <canvas id="c" width="800" height="420"></canvas>
  <p><a href="https://github.com/Fomorianshifter/Mynewproject-SolarSystem">Original repo</a></p>
</main>
<script>
const c = document.getElementById("c"), x = c.getContext("2d");
const bodies = [
  {n:"Mercury", r:46, s:1.6, col:"#c8b8a2", d:3},
  {n:"Venus", r:70, s:1.2, col:"#e0c48a", d:5},
  {n:"Earth", r:96, s:1, col:"#7eb6d9", d:5},
  {n:"Mars", r:122, s:.8, col:"#d07a55", d:4},
  {n:"Jupiter", r:168, s:.45, col:"#d8b48a", d:11}
];
let t = 0;
function frame() {
  t += 0.01;
  x.fillStyle = "#070a08"; x.fillRect(0,0,c.width,c.height);
  x.beginPath(); x.arc(400,210,16,0,7); x.fillStyle = "#f2d56b"; x.fill();
  bodies.forEach(b => {
    x.strokeStyle = "#243024"; x.beginPath(); x.arc(400,210,b.r,0,7); x.stroke();
    const a = t * b.s;
    x.beginPath(); x.arc(400 + Math.cos(a)*b.r, 210 + Math.sin(a)*b.r*0.55, b.d, 0, 7);
    x.fillStyle = b.col; x.fill();
  });
  requestAnimationFrame(frame);
}
frame();
</script>
</body></html>
