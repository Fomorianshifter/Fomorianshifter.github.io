<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orbit lab — Nicholas Lane</title>
  <link rel="stylesheet" href="../styles.css">
</head>
<body>
  <header><div class="wrap"><nav><a class="brand" href="../index.html">Nicholas Lane</a><div class="links"><a href="../index.html#projects">Projects</a> <a href="https://github.com/Fomorianshifter/Mynewproject-SolarSystem">Repo</a></div></nav></div></header>
  <main class="wrap">
    <section class="hero">
      <div class="kicker">From Mynewproject-SolarSystem</div>
      <h1>Orbit lab</h1>
      <p class="lede">A working version of the public planets-in-orbit sketch. Distances are scaled for the screen, not to true astronomical units.</p>
      <button class="btn" id="toggle" type="button">Pause</button>
    </section>
    <canvas id="sky" width="960" height="560"></canvas>
  </main>
  <script>
    const canvas = document.getElementById("sky");
    const ctx = canvas.getContext("2d");
    const bodies = [
      { r: 46, size: 4, color: "#c9b59a", speed: 0.018 },
      { r: 70, size: 6, color: "#e0c07a", speed: 0.013 },
      { r: 96, size: 6, color: "#7eb0d4", speed: 0.01 },
      { r: 122, size: 5, color: "#c46a45", speed: 0.008 },
      { r: 168, size: 14, color: "#d7b48a", speed: 0.0045 },
      { r: 214, size: 12, color: "#e6d3a3", speed: 0.0032, ring: true }
    ];
    let t = 0;
    let running = true;
    document.getElementById("toggle").addEventListener("click", (e) => {
      running = !running;
      e.target.textContent = running ? "Pause" : "Resume";
    });
    function frame() {
      const w = canvas.width;
      const h = canvas.height;
      ctx.fillStyle = "#0d0f0b";
      ctx.fillRect(0, 0, w, h);
      const cx = w / 2;
      const cy = h / 2;
      ctx.fillStyle = "#e8b36a";
      ctx.beginPath();
      ctx.arc(cx, cy, 18, 0, Math.PI * 2);
      ctx.fill();
      bodies.forEach((b) => {
        ctx.strokeStyle = "#3a382c";
        ctx.beginPath();
        ctx.ellipse(cx, cy, b.r, b.r * 0.42, 0, 0, Math.PI * 2);
        ctx.stroke();
        const a = t * b.speed;
        const x = cx + Math.cos(a) * b.r;
        const y = cy + Math.sin(a) * b.r * 0.42;
        ctx.fillStyle = b.color;
        ctx.beginPath();
        ctx.arc(x, y, b.size, 0, Math.PI * 2);
        ctx.fill();
        if (b.ring) {
          ctx.strokeStyle = "#efe7d6";
          ctx.beginPath();
          ctx.ellipse(x, y, b.size + 8, 4, 0.4, 0, Math.PI * 2);
          ctx.stroke();
        }
      });
      if (running) t += 1;
      requestAnimationFrame(frame);
    }
    frame();
  </script>
</body>
</html>
