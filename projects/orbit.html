<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>Orbit lab — Nicholas Lane</title><link rel="stylesheet" href="../styles.css"/><link rel="icon" href="../favicon.svg"/></head>
<body><header class="nav"><div class="wrap"><a class="brand" href="../index.html">NL <span>//</span> LANE</a><nav><a href="https://github.com/Fomorianshifter/SolarSystem">SolarSystem repo</a><a href="loto.html">LOTO</a></nav></div></header>
<main class="wrap"><section class="hero"><p class="kicker">From the SolarSystem repo</p><h1>Orbit lab</h1><p class="lede">A small live version of the planet-alignment idea in github.com/Fomorianshifter/SolarSystem. Four bodies, different periods.</p></section>
<section class="lab"><canvas id="c" width="640" height="360" style="width:100%;max-width:640px;background:#0b0f0c;border-radius:10px"></canvas>
<p class="meta">Canvas animation. Original repo: <a href="https://github.com/Fomorianshifter/SolarSystem">Fomorianshifter/SolarSystem</a></p></section></main>
<script>
var c=document.getElementById("c"), x=c.getContext("2d"), t=0;
var bodies=[{r:46,p:2.4,col:"#c45b4a",s:5},{r:78,p:4.2,col:"#e2a23a",s:7},{r:118,p:7.1,col:"#7dba6a",s:6},{r:156,p:11,col:"#8eb4e8",s:5}];
function frame(){
  t+=0.016; x.clearRect(0,0,640,360);
  x.fillStyle="#f3c56b"; x.beginPath(); x.arc(320,180,16,0,6.28); x.fill();
  bodies.forEach(function(b){
    x.strokeStyle="#2a352c"; x.beginPath(); x.arc(320,180,b.r,0,6.28); x.stroke();
    var a=t*6.28/b.p, px=320+Math.cos(a)*b.r, py=180+Math.sin(a)*b.r*0.42;
    x.fillStyle=b.col; x.beginPath(); x.arc(px,py,b.s,0,6.28); x.fill();
  });
  requestAnimationFrame(frame);
}
frame();
</script></body></html>
