<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Orbit lab</title><style>body{margin:0;background:#16130f}canvas{width:100%;height:390px;display:block}</style></head><body><canvas id="c"></canvas><script>const c=document.querySelector("#c");const ctx=c.getContext("2d");const planets=[{r:46,size:4,color:"#c47a2c",speed:.018},{r:78,size:6,color:"#7f9b8a",speed:.012},{r:112,size:7,color:"#d7c4a3",speed:.008},{r:150,size:5,color:"#b9c7d6",speed:.005}];function frame(t){const w=c.width=c.clientWidth*devicePixelRatio;const h=c.height=390*devicePixelRatio;ctx.clearRect(0,0,w,h);const cx=w/2,cy=h/2;ctx.fillStyle="#e7c56a";ctx.beginPath();ctx.arc(cx,cy,14*devicePixelRatio,0,7);ctx.fill();planets.forEach(p=>{ctx.strokeStyle="#3c342b";ctx.beginPath();ctx.arc(cx,cy,p.r*devicePixelRatio,0,7);ctx.stroke();const a=t*p.speed;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(cx+Math.cos(a)*p.r*devicePixelRatio,cy+Math.sin(a)*p.r*.62*devicePixelRatio,p.size*devicePixelRatio,0,7);ctx.fill()});requestAnimationFrame(frame)}requestAnimationFrame(frame);</script></body></html>
