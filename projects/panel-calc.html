<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Panel Load Check — Nicholas Lane</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
  <link rel="stylesheet" href="../styles.css" />
  <style>
    input, select { background:var(--elevated); color:var(--fg); border:1px solid var(--border); border-radius:8px; padding:.55rem .7rem; font:inherit; width:100%; max-width:20rem; }
    label { display:block; margin:.85rem 0 .35rem; color:var(--muted); font-size:.875rem; }
    #list { list-style:none; padding:0; margin:1rem 0 0; }
    #list li { display:flex; justify-content:space-between; gap:1rem; padding:.5rem 0; border-top:1px solid var(--border); font-size:.875rem; }
  </style>
</head>
<body>
  <header class="site-header"><div class="wrap"><a class="brand" href="../index.html">Nicholas Lane</a><nav><a href="../index.html#work">Work</a><a href="../resume.html">Resume</a></nav></div></header>
  <main class="wrap section" style="padding-top:2rem">
    <p class="mono-kicker">Live demo · electrical</p>
    <h1>Panel Load Check</h1>
    <p class="lede">Add loads, get total VA and amps. Training tool only — not a full NEC load calculation.</p>
    <div class="card" style="margin-top:1.5rem">
      <label>Voltage
        <select id="v"><option value="120">120 V</option><option value="240" selected>240 V</option><option value="480">480 V</option></select>
      </label>
      <label>Load name <input id="name" placeholder="e.g. heater bank" /></label>
      <label>Watts (approx VA) <input id="w" type="number" value="1500" min="0" /></label>
      <div class="actions"><button class="btn btn-primary" id="add" type="button">Add load</button></div>
      <ul id="list"></ul>
      <p class="muted" id="out" style="margin-top:1rem">Total: 0 VA · 0 A</p>
    </div>
  </main>
  <script>
    const loads=[];
    const list=document.getElementById('list');
    const out=document.getElementById('out');
    function render(){
      list.innerHTML='';
      let va=0;
      loads.forEach((l,i)=>{
        va+=l.w;
        const li=document.createElement('li');
        li.innerHTML='<span>'+l.name+' — '+l.w+' VA</span>';
        const b=document.createElement('button');
        b.className='btn btn-outline';
        b.textContent='Remove';
        b.onclick=()=>{ loads.splice(i,1); render(); };
        li.appendChild(b);
        list.appendChild(li);
      });
      const v=Number(document.getElementById('v').value);
      out.textContent='Total: '+va+' VA · '+(v? (va/v).toFixed(2) : '0.00')+' A @ '+v+' V';
    }
    document.getElementById('add').onclick=()=>{
      loads.push({ name: document.getElementById('name').value || 'load', w: Number(document.getElementById('w').value) || 0 });
      render();
    };
    document.getElementById('v').onchange=render;
    render();
  </script>
</body>
</html>
