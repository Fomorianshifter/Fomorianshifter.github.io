<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shift fault log — Nicholas Lane</title>
  <link rel="stylesheet" href="../styles.css">
</head>
<body>
  <header><div class="wrap"><nav><a class="brand" href="../index.html">Nicholas Lane</a><div class="links"><a href="../index.html#projects">Projects</a></div></nav></div></header>
  <main class="wrap">
    <section class="hero">
      <div class="kicker">Portfolio lab</div>
      <h1>Shift fault log</h1>
      <p class="lede">A small stand-in for a maintenance note: asset, symptom, and what was checked. Entries stay in this browser only.</p>
    </section>
    <section class="panel">
      <form id="form">
        <div class="row">
          <div><label for="asset">Asset</label><input id="asset" required placeholder="Mold line conveyor 2"></div>
          <div><label for="symptom">Symptom</label><input id="symptom" required placeholder="Drive will not seal in"></div>
        </div>
        <label for="note">Checked</label>
        <textarea id="note" rows="3" placeholder="Stop circuit closed, overload reset, aux contact dirty"></textarea>
        <div class="actions"><button class="btn" type="submit">Add entry</button> <button class="btn ghost" id="clear" type="button">Clear log</button></div>
      </form>
      <table>
        <thead><tr><th>When</th><th>Asset</th><th>Symptom</th><th>Checked</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </section>
  </main>
  <script>
    const key = "lane-fault-log";
    const rows = document.getElementById("rows");
    function load() { return JSON.parse(localStorage.getItem(key) || "[]"); }
    function save(items) { localStorage.setItem(key, JSON.stringify(items)); }
    function draw() {
      rows.innerHTML = "";
      load().forEach((item) => {
        const tr = document.createElement("tr");
        [item.when, item.asset, item.symptom, item.note].forEach((text) => {
          const td = document.createElement("td");
          td.textContent = text;
          tr.appendChild(td);
        });
        rows.appendChild(tr);
      });
    }
    document.getElementById("form").addEventListener("submit", (e) => {
      e.preventDefault();
      const items = load();
      items.unshift({
        when: new Date().toLocaleString(),
        asset: document.getElementById("asset").value,
        symptom: document.getElementById("symptom").value,
        note: document.getElementById("note").value
      });
      save(items.slice(0, 30));
      e.target.reset();
      draw();
    });
    document.getElementById("clear").addEventListener("click", () => { save([]); draw(); });
    draw();
  </script>
</body>
</html>
