<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shift fault log — Nicholas Lane</title><link rel="stylesheet" href="../styles.css"></head>
<body><header><nav><a href="../index.html">Home</a></nav><h1>Shift fault log</h1>
<p class="meta">Stored only in this browser (localStorage). Nothing is uploaded.</p></header>
<main>
<form class="card" id="f">
<label>Asset<input name="asset" required placeholder="Line 2 conveyor"></label>
<label>Symptom<textarea name="note" required placeholder="Starter chatters, overload warm"></textarea></label>
<button>Add call</button>
</form>
<ul id="list"></ul>
</main>
<script>
const KEY='lane-faults';
const list=document.getElementById('list');
function load(){return JSON.parse(localStorage.getItem(KEY)||'[]')}
function render(){
  list.innerHTML='';
  load().forEach((row,i)=>{
    const li=document.createElement('li');
    li.className='card';
    li.textContent=new Date(row.t).toLocaleString()+' · '+row.asset+' — '+row.note;
    const b=document.createElement('button'); b.textContent='Clear'; b.onclick=()=>{const a=load(); a.splice(i,1); localStorage.setItem(KEY,JSON.stringify(a)); render();};
    li.appendChild(b); list.appendChild(li);
  });
}
document.getElementById('f').onsubmit=e=>{
  e.preventDefault();
  const fd=new FormData(e.target);
  const a=load(); a.unshift({t:Date.now(), asset:fd.get('asset'), note:fd.get('note')});
  localStorage.setItem(KEY, JSON.stringify(a)); e.target.reset(); render();
};
render();
</script></body></html>
