<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Shift fault log</title><style>body{margin:0;font-family:sans-serif;background:#16130f;color:#f4efe6}main{padding:14px}form{display:flex;gap:8px;flex-wrap:wrap}input,select,button{font:inherit;border-radius:8px;border:1px solid #3c342b;background:#241f1a;color:#f4efe6;padding:8px}button{background:#c47a2c;color:#1c1915;border:0;cursor:pointer}ul{list-style:none;padding:0;margin:12px 0 0}li{display:flex;justify-content:space-between;gap:8px;border-top:1px solid #3c342b;padding:8px 0}.cleared{opacity:.45;text-decoration:line-through}</style></head><body><main><form id="form"><input id="area" placeholder="Area, e.g. melt deck" required><input id="note" placeholder="Fault, e.g. conveyor photoeye" required><select id="priority"><option>Low</option><option selected>Medium</option><option>High</option></select><button>Log</button></form><ul id="list"></ul></main><script>const key="lane-fault-log";const list=document.querySelector("#list");const load=()=>JSON.parse(localStorage.getItem(key)||"[]");const save=rows=>localStorage.setItem(key,JSON.stringify(rows));function draw(){list.innerHTML="";load().forEach((row,i)=>{const li=document.createElement("li");li.className=row.cleared?"cleared":"";li.innerHTML=`<span><strong>${row.priority}</strong> ${row.area} — ${row.note}</span>`;const b=document.createElement("button");b.textContent=row.cleared?"Reopen":"Clear";b.onclick=()=>{const rows=load();rows[i].cleared=!rows[i].cleared;save(rows);draw()};li.append(b);list.append(li)})}document.querySelector("#form").onsubmit=e=>{e.preventDefault();const rows=load();rows.unshift({area:area.value,note:note.value,priority:priority.value,cleared:false});save(rows);e.target.reset();draw()};draw();</script></body></html>
