<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shift fault log</title><link rel="stylesheet" href="../styles.css"></head>
<body>
<header><nav><strong>Nicholas Lane</strong><a href="../index.html">Portfolio</a></nav>
<h1>Shift fault log</h1>
<p class="lede">Calls stay in this browser (localStorage). Nothing is uploaded.</p></header>
<main>
<label>Asset <input id="asset" placeholder="Mold line 2, conveyor 4"></label>
<label>Symptom <input id="sym" placeholder="Starter chatters, no seal-in"></label>
<label>What fixed it <textarea id="fix" rows="3" placeholder="Replaced aux contact"></textarea></label>
<p><button id="add">Add call</button> <button id="clear">Clear log</button></p>
<div id="list"></div>
</main>
<script>
const KEY="nlane-fault-log";
const load=()=>JSON.parse(localStorage.getItem(KEY)||"[]");
function render(){
  const rows=load();
  list.innerHTML=rows.map(r=>`<article class="card"><h3>${r.asset}</h3><p>${r.sym}</p><p class="meta">${r.fix}</p><p class="meta">${r.when}</p></article>`).join("")||"<p class='meta'>No calls yet.</p>";
}
add.onclick=()=>{
  if(!asset.value.trim()) return;
  const rows=load();
  rows.unshift({asset:asset.value.trim(),sym:sym.value.trim(),fix:fix.value.trim(),when:new Date().toLocaleString()});
  asset.value=sym.value=fix.value="";
  localStorage.setItem(KEY, JSON.stringify(rows));
  render();
};
clear.onclick=()=>{localStorage.removeItem(KEY); render();};
render();
</script>
</body></html>
