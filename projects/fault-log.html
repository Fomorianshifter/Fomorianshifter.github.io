<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Shift fault log — Nicholas Lane</title><link rel="icon" href="../favicon.svg"><link rel="stylesheet" href="../styles.css"></head>
<body><header><nav class="nav"><a class="brand" href="../index.html">NL</a><a href="../projects.html">Projects</a></nav></header>
<main><p class="kicker">Local only</p><h1>Shift fault log</h1>
<p class="lede">A small CMMS-style log for a phone. Entries stay in this browser. Nothing is uploaded.</p>
<form id="log"><label>Asset <input id="asset" required placeholder="Furnace conveyor 2"></label>
<label>Symptom <input id="symptom" required placeholder="Starter chatters"></label>
<label>Action <textarea id="action" required placeholder="Checked aux contact and tightened coil leads"></textarea></label>
<p><button class="primary" type="submit">Add entry</button> <button type="button" id="clear">Clear log</button></p></form>
<div id="list"></div><footer><a href="../projects.html">Back to projects</a></footer></main>
<script>
const key="nl-fault-log";
function load(){return JSON.parse(localStorage.getItem(key)||"[]");}
function save(rows){localStorage.setItem(key,JSON.stringify(rows));render();}
function render(){
const rows=load();
document.getElementById("list").innerHTML=rows.map((row)=>`<article class="card"><strong>${row.asset}</strong><p>${row.symptom}</p><p>${row.action}</p><p class="kicker">${row.when}</p></article>`).join("")||"<p>No entries yet.</p>";
}
document.getElementById("log").addEventListener("submit",(event)=>{
event.preventDefault();
const rows=load();
rows.unshift({asset:document.getElementById("asset").value,symptom:document.getElementById("symptom").value,action:document.getElementById("action").value,when:new Date().toLocaleString()});
event.target.reset();save(rows);
});
document.getElementById("clear").addEventListener("click",()=>save([]));
render();
</script></body></html>
