<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fault log — Nicholas Lane</title>
  <link rel="icon" href="../favicon.svg">
  <link rel="stylesheet" href="../styles.css">
</head>
<body>
  <header>
    <nav class="nav">
      <a class="brand" href="../index.html">NL</a>
      <a href="../projects.html">Projects</a>
    </nav>
  </header>
  <main>
    <p class="kicker">Maintenance log</p>
    <h1>Shift fault log</h1>
    <p class="lede">Entries stay in this browser (localStorage). Clear them before handing the laptop to someone else.</p>
    <div class="card">
      <label>Asset</label>
      <input id="asset" placeholder="MCC-2 feeder 4">
      <label>Symptom</label>
      <input id="symptom" placeholder="Motor would not start after stop">
      <label>Action</label>
      <textarea id="action" rows="3" placeholder="Checked stop contact and overload. Reset and test-ran."></textarea>
      <p><button class="btn" id="add" type="button">Add entry</button> <button class="btn ghost" id="clear" type="button">Clear log</button></p>
    </div>
    <table>
      <thead><tr><th>When</th><th>Asset</th><th>Symptom</th><th>Action</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </main>
  <script>
    var key = "nl-fault-log";
    function load() { try { return JSON.parse(localStorage.getItem(key) || "[]"); } catch (e) { return []; } }
    function save(rows) { localStorage.setItem(key, JSON.stringify(rows)); }
    function draw() {
      var rows = load();
      document.getElementById("rows").innerHTML = rows.map(function (r) {
        return "<tr><td>" + r.when + "</td><td>" + r.asset + "</td><td>" + r.symptom + "</td><td>" + r.action + "</td></tr>";
      }).join("") || "<tr><td colspan='4'>No entries yet.</td></tr>";
    }
    function esc(s) { return String(s).replace(/[&<>]/g, function (c) { return { "&":"&","<":"<",">":">" }[c]; }); }
    document.getElementById("add").onclick = function () {
      var rows = load();
      rows.unshift({
        when: new Date().toLocaleString(),
        asset: esc(document.getElementById("asset").value || "—"),
        symptom: esc(document.getElementById("symptom").value || "—"),
        action: esc(document.getElementById("action").value || "—")
      });
      save(rows); draw();
    };
    document.getElementById("clear").onclick = function () { localStorage.removeItem(key); draw(); };
    draw();
  </script>
</body>
</html>
