<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shift fault log — Nicholas Lane</title>
  <link rel="stylesheet" href="../styles.css" />
</head>
<body>
  <header class="top"><a class="mark" href="../index.html">NL</a><nav><a href="../index.html">Home</a></nav></header>
  <main>
    <h1>Shift fault log</h1>
    <p class="note">Sample foundry-style tickets. Filter stays in this browser. Nothing is uploaded.</p>
    <label>Asset
      <select id="filter">
        <option value="all">All</option>
        <option value="motor">Motor</option>
        <option value="sensor">Sensor</option>
        <option value="plc">PLC</option>
      </select>
    </label>
    <ul id="list"></ul>
  </main>
  <script>
    const rows = [
      { asset: "motor", text: "Mold line 2 — conveyor motor overload after restart." },
      { asset: "sensor", text: "Pour deck — proximity sensor stuck high, gate would not index." },
      { asset: "plc", text: "Shot blast — input card not seen after panel washdown. Reseated and logged." },
      { asset: "motor", text: "Shakeout — starter chatter, loose control wire on seal-in." },
      { asset: "sensor", text: "Cooling — photoeye dirty, false stops on the transfer." }
    ];
    const list = document.getElementById("list");
    function draw() {
      const f = filter.value;
      list.innerHTML = rows.filter(r => f === "all" || r.asset === f)
        .map(r => "<li><strong>" + r.asset + "</strong> — " + r.text + "</li>").join("");
    }
    filter.addEventListener("change", draw);
    draw();
  </script>
</body>
</html>
