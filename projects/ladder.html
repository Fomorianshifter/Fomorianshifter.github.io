<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Start / stop seal-in — Nicholas Lane</title>
  <link rel="stylesheet" href="../styles.css" />
</head>
<body>
  <header class="top"><a class="mark" href="../index.html">NL</a><nav><a href="../index.html#labs">Projects</a></nav></header>
  <main class="lab">
    <h1>Start / stop seal-in</h1>
    <p>Stop is normally closed. Start is normally open. The motor contact seals around start. Click a contact to toggle it. This is a picture of the idea, not a safety circuit.</p>
    <div class="panel" id="ladder"></div>
    <p id="status">Motor off</p>
  </main>
  <script>
    const state = { stop: true, start: false, motor: false };
    const root = document.getElementById("ladder");
    function evalMotor() {
      state.motor = state.stop && (state.start || state.motor);
      if (!state.stop) state.motor = false;
    }
    function draw() {
      evalMotor();
      root.innerHTML = "";
      [["Stop NC", "stop", state.stop], ["Start NO", "start", state.start], ["Seal-in", "seal", state.motor]].forEach(([label, key, on]) => {
        const row = document.createElement("div");
        row.className = "rung";
        const b = document.createElement("button");
        b.className = "contact" + (on ? " on" : "");
        b.textContent = label + (on ? " closed" : " open");
        b.disabled = key === "seal";
        if (key !== "seal") b.onclick = () => { state[key] = !state[key]; draw(); };
        const coil = document.createElement("span");
        coil.className = "contact coil" + (state.motor ? " on" : "");
        coil.textContent = state.motor ? "( M )" : "(   )";
        row.append(b, document.createTextNode(" —— "), coil);
        root.append(row);
      });
      document.getElementById("status").textContent = state.motor ? "Motor running" : "Motor off";
    }
    draw();
  </script>
</body>
</html>
