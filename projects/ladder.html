<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Motor starter ladder — Nicholas Lane</title>
  <link rel="stylesheet" href="../styles.css">
</head>
<body>
  <header class="site"><div class="wrap nav"><a class="brand" href="../index.html"><span class="mark">NL</span> Nicholas Lane</a><ul><li><a href="../projects.html">Projects</a></li></ul></div></header>
  <main class="wrap">
    <section>
      <h1>Three-wire motor starter</h1>
      <p class="sub">Stop is normally closed. Start is momentary. The auxiliary contact seals the coil in. Overload opens the rung.</p>
      <div class="card ladder">
        <div class="rung">
          <button class="btn ghost" id="stop" type="button">Stop NC</button>
          <div>Stop contact · <span id="stopState">closed</span></div>
          <div></div>
        </div>
        <div class="rung">
          <button class="btn ghost" id="start" type="button">Start NO</button>
          <div>Start in parallel with M aux seal-in</div>
          <div class="coil" id="coil">M</div>
        </div>
        <div class="rung">
          <button class="btn ghost" id="ol" type="button">OL NC</button>
          <div>Overload · <span id="olState">closed</span></div>
          <div></div>
        </div>
        <p class="out" id="status">Coil de-energized. Motor off.</p>
      </div>
    </section>
  </main>
  <script>
    let stopClosed = true, olClosed = true, sealed = false, holding = false;
    const paint = () => {
      const on = stopClosed && olClosed && (holding || sealed);
      sealed = on;
      coil.className = on ? "coil on" : "coil";
      stopState.textContent = stopClosed ? "closed" : "open";
      olState.textContent = olClosed ? "closed" : "open";
      status.textContent = on ? "Coil energized. Aux contact sealed in." : "Coil de-energized. Motor off.";
    };
    stop.onclick = () => { stopClosed = !stopClosed; paint(); };
    ol.onclick = () => { olClosed = !olClosed; paint(); };
    start.onpointerdown = () => { holding = true; paint(); };
    start.onpointerup = start.onpointerleave = () => { holding = false; paint(); };
    paint();
  </script>
</body>
</html>
