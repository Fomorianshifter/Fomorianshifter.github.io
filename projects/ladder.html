<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Ladder scan</title><link rel="stylesheet" href="../styles.css" /></head>
<body><div class="wrap"><header class="nav"><div class="brand"><a href="../index.html">NICHOLAS LANE</a></div><nav><a href="../projects.html">Projects</a></nav></header>
<div class="kicker">Live demo</div><h1>Start / stop ladder</h1>
<div class="demo-stage"><p><button id="start">Start (NO)</button> <button id="stop">Stop (NC held)</button> Coil M1 <span id="coil" class="lamp"></span></p>
<pre id="rung" class="copy"></pre><p class="meta" id="scan">scan 0</p></div>
<script>
let start=false,stop=true,m1=false,n=0,stopHeld=true;
const coil=document.getElementById("coil"),rung=document.getElementById("rung"),scan=document.getElementById("scan");
function tick(){n++;m1=stop&&(start||m1);coil.className="lamp"+(m1?" on":"");rung.textContent="START="+start+"  STOP_OK="+stop+"  M1="+m1+"\nSeal-in keeps M1 after Start is released.";scan.textContent="scan "+n;}
document.getElementById("start").onmousedown=()=>{start=true;};
document.getElementById("start").onmouseup=()=>{start=false;};
document.getElementById("stop").onclick=()=>{stopHeld=!stopHeld;stop=stopHeld;document.getElementById("stop").textContent=stopHeld?"Stop (NC held)":"Stop PRESSED";};
setInterval(tick,50);
</script></div></body></html>
