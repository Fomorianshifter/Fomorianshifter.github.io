  <main>
    <p class="eyebrow">Controls lab</p>
    <h1>Ladder Logic Lab</h1>
    <p class="lede">Classic 3-wire start/stop seal-in plus an on-delay timer (TON). Hold START, tap STOP. Motor seals in until stop or power drop.</p>
    <p>
      <label><input type="checkbox" id="start"> START (NO)</label>
      <label><input type="checkbox" id="stop" checked> STOP (NC)</label>
      <label><input type="checkbox" id="pwr" checked> Power</label>
    </p>
    <div class="rung"><span>|—[ START ]——[ STOP NC ]——[ M ]——( M )—|</span><span id="mcoil" class="coil off">M OFF</span></div>
    <div class="rung"><span>|—[ M ]——[ TON 2.0s ]——( TDN )—|</span><span id="tcoil" class="coil off">TDN OFF</span></div>
    <p class="meta" id="note">Timer: 0.0s</p>
  </main>
  <script>
    const start = document.getElementById('start');
    const stop = document.getElementById('stop');
    const pwr = document.getElementById('pwr');
    let M = false, acc = 0, last = performance.now();
    function tick(now) {
      const dt = (now - last) / 1000; last = now;
      if (!pwr.checked) { M = false; acc = 0; }
      else {
        const stopOK = stop.checked;
        if (start.checked && stopOK) M = true;
        if (!stopOK) M = false;
        if (M) acc = Math.min(2, acc + dt); else acc = 0;
      }
      const TDN = acc >= 2;
      const mc = document.getElementById('mcoil');
      const tc = document.getElementById('tcoil');
      mc.textContent = M ? 'M ON' : 'M OFF';
      mc.className = 'coil ' + (M ? 'on' : 'off');
      tc.textContent = TDN ? 'TDN ON' : 'TDN OFF';
      tc.className = 'coil ' + (TDN ? 'on' : 'off');
      document.getElementById('note').textContent = 'Timer: ' + acc.toFixed(1) + 's / 2.0s';
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  </script>
</body>
</html>
