<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Start / stop seal-in — Nicholas Lane</title>
  <link rel="stylesheet" href="../styles.css">
</head>
<body>
  <header>
    <strong>Start / stop seal-in</strong>
    <nav><a href="../index.html">Home</a></nav>
  </header>
  <main>
    <section>
      <p class="note">Stop is normally closed. Start is normally open. The motor contact seals around Start. Overload drops the coil.</p>
      <div class="card ladder" id="board"></div>
      <div class="out" id="status">Coil off.</div>
    </section>
  </main>
  <script>
    const state = { stop: true, start: false, ol: true, motor: false };
    const board = document.getElementById("board");
    function render() {
      state.motor = state.stop && state.ol && (state.start || state.motor);
      if (!state.stop || !state.ol) state.motor = false;
      board.innerHTML = `
        <div class="rung"><span>L1</span><span>Stop NC <button class="action" data-k="stop">${state.stop ? "closed" : "open"}</button></span><span></span></div>
        <div class="rung"><span></span><span>Start NO <button class="action" data-k="start">${state.start ? "closed" : "open"}</button> in parallel with M seal</span><span class="coil ${state.motor ? "on" : ""}">M</span></div>
        <div class="rung"><span></span><span>Overload NC <button class="action" data-k="ol">${state.ol ? "closed" : "tripped"}</button></span><span>L2</span></div>`;
      document.getElementById("status").textContent = state.motor ? "Coil sealed in. Motor contact holding." : "Coil off.";
    }
    board.onclick = (e) => {
      const k = e.target.dataset.k;
      if (!k) return;
      state[k] = !state[k];
      if (k === "start" && !state.start) { /* release does not drop a sealed coil */ }
      render();
    };
    render();
  </script>
</body>
</html>
