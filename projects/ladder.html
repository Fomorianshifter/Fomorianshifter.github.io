<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ladder rung trainer</title>
  <link rel="stylesheet" href="../styles.css" />
</head>
<body>
  <header class="nav"><a class="brand" href="../">NL</a><nav><a href="../">Home</a></nav></header>
  <main>
    <p class="eyebrow">Controls demo</p>
    <h1>Start / stop latch</h1>
    <p>Click Start to seal in the motor bit. Stop breaks the seal. E-stop drops everything.</p>
    <div class="rung" id="rung"></div>
    <p class="meta" id="status">Motor OFF</p>
  </main>
  <script>
    const state = { start: false, stop: true, estop: false, motor: false };
    function tick() {
      if (state.estop) state.motor = false;
      else if (!state.stop) state.motor = false;
      else if (state.start || state.motor) state.motor = true;
      render();
    }
    function bit(key, label, invert) {
      const on = invert ? !state[key] : state[key];
      return '<span class="bit ' + (on ? 'on' : '') + '" data-k="' + key + '">' + label + '</span>';
    }
    function render() {
      document.getElementById('rung').innerHTML =
        '| ' + bit('start','START') + ' )--( ' + bit('stop','STOP',true) + ' )--( ' + bit('estop','E-STOP',true) + ' )--( ' + bit('motor','M') + ' |' +
        '<br>| ' + bit('motor','M seal') + ' )--------------------------------( ' + bit('motor','M') + ' |';
      document.getElementById('status').textContent = state.motor ? 'Motor ON — sealed in' : 'Motor OFF';
      document.querySelectorAll('.bit').forEach((el) => {
        el.onclick = () => {
          const k = el.dataset.k;
          if (k === 'start') { state.start = true; tick(); state.start = false; }
          else state[k] = !state[k];
          tick();
        };
      });
    }
    tick();
  </script>
</body>
</html>
