<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Starter ladder — Nicholas Lane</title>
  <link rel="stylesheet" href="../styles.css">
</head>
<body>
  <header><a href="../index.html">Nicholas Lane</a><nav><a href="../index.html#labs">Labs</a></nav></header>
  <main>
    <p class="kicker">Lab · PLC path</p>
    <h1>Three-wire starter</h1>
    <p class="lede">Stop is normally closed. Start is normally open. The seal-in contact holds the coil after start is released. Overload opens the rung.</p>
    <div class="panel">
      <p>Stop <button type="button" id="stop">closed</button>
         Start <button type="button" id="start">open</button>
         Overload <button type="button" id="ol">closed</button></p>
      <pre id="rung"></pre>
      <p class="out" id="coil">Coil: off</p>
    </div>
  </main>
  <script>
    const state = { stop: true, start: false, ol: true, seal: false };
    const labels = { stop: ["open", "closed"], start: ["open", "closed"], ol: ["tripped", "closed"] };
    function draw() {
      const coil = state.stop && state.ol && (state.start || state.seal);
      state.seal = coil;
      document.getElementById("stop").textContent = labels.stop[state.stop ? 1 : 0];
      document.getElementById("start").textContent = labels.start[state.start ? 1 : 0];
      document.getElementById("ol").textContent = labels.ol[state.ol ? 1 : 0];
      document.getElementById("rung").textContent =
        "L1 --[ " + (state.stop ? "STOP" : "stop") + " ]--[ " + (state.start ? "START" : "start") + " ]--+--( M )-- L2\n" +
        "                     [ " + (state.seal ? "M" : "m") + " seal ]--------+--[ " + (state.ol ? "OL" : "ol") + " ]--";
      document.getElementById("coil").textContent = "Coil: " + (coil ? "on" : "off");
    }
    document.getElementById("stop").onclick = () => { state.stop = !state.stop; draw(); };
    document.getElementById("start").onclick = () => { state.start = !state.start; draw(); };
    document.getElementById("ol").onclick = () => { state.ol = !state.ol; draw(); };
    draw();
  </script>
</body>
</html>
