<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PLC ladder scan</title>
  <link rel="stylesheet" href="../styles.css" />
</head>
<body>
  <header class="nav"><a class="mark" href="/">NL</a><nav><a href="/">Home</a></nav></header>
  <div class="lab-wrap">
    <h1>PLC ladder scan</h1>
    <p class="muted">Toggle inputs. The scan evaluates the rung and lights the coil. This is a teaching demo, not a real controller.</p>
    <div class="panel" style="padding:1rem">
      <p><label><input type="checkbox" id="i1" /> Input I1 (start)</label></p>
      <p><label><input type="checkbox" id="i2" checked /> Input I2 (permissive / not-stop)</label></p>
      <p>Rung: <code>I1 AND I2 → Coil C1</code></p>
      <p>Coil C1: <strong id="coil">OFF</strong></p>
      <p class="muted" id="scan">Scan #0</p>
    </div>
  </div>
  <script>
    const i1 = document.getElementById('i1');
    const i2 = document.getElementById('i2');
    const coil = document.getElementById('coil');
    const scan = document.getElementById('scan');
    let n = 0;
    function tick() {
      n += 1;
      const on = i1.checked && i2.checked;
      coil.textContent = on ? 'ON' : 'OFF';
      coil.style.color = on ? '#7ad0a5' : '#e08b6f';
      scan.textContent = 'Scan #' + n;
    }
    i1.addEventListener('change', tick);
    i2.addEventListener('change', tick);
    setInterval(tick, 400);
    tick();
  </script>
</body>
</html>
