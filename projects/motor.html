<h1>Motor FLA ballpark</h1>
<p class="lede">Assumes 85% efficiency and 0.85 power factor. A nameplate or NEC 430.248 / 430.250 table wins on a real motor.</p>
<div class="card">
  <label>Horsepower <input id="hp" type="number" value="5" min="0.25" step="0.25"></label>
  <label>Volts <input id="mvolts" type="number" value="480"></label>
  <label>Phase <select id="phase"><option value="3">3</option><option value="1">1</option></select></label>
  <p class="stat" id="fla"></p>
</div>
<script>
function fla() {
  const hp = +document.getElementById("hp").value;
  const v = +document.getElementById("mvolts").value;
  const ph = +document.getElementById("phase").value;
  const watts = hp * 746 / 0.85 / 0.85;
  const amps = ph === 3 ? watts / (v * Math.sqrt(3)) : watts / v;
  document.getElementById("fla").textContent = "About " + amps.toFixed(1) + " A (not a nameplate)";
}
["hp","mvolts","phase"].forEach(id => document.getElementById(id).addEventListener("input", fla));
fla();
</script>
