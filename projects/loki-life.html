<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Loki life-cycle — Nicholas Lane</title>
  <link rel="icon" href="../favicon.svg" />
  <link rel="stylesheet" href="../styles.css" />
</head>
<body>
  <header class="nav">
    <a class="brand" href="../index.html">NL<span>.</span></a>
    <nav>
      <a href="../index.html">Home</a>
      <a href="../projects.html" class="active">Projects</a>
      <a href="../resume.html">Resume</a>
    </nav>
  </header>
  <main>
    <p class="eyebrow">State machine</p>
    <h1>Loki life-cycle</h1>
    <p class="lede">Tiny browser sketch of the companion’s mood loop. Energy drains while hunting, recovers at rest.</p>
    <p>
      <button class="btn primary" id="hunt">Hunt</button>
      <button class="btn" id="rest">Rest</button>
      <button class="btn" id="idle">Idle</button>
    </p>
    <article class="card">
      <p>State: <strong id="st">idle</strong></p>
      <p>Energy: <strong id="en">80</strong></p>
      <p class="meta" id="log">Waiting.</p>
    </article>
  </main>
  <script>
    let state = 'idle', energy = 80;
    const st = document.getElementById('st');
    const en = document.getElementById('en');
    const log = document.getElementById('log');
    function set(s){ state=s; st.textContent=s; }
    document.getElementById('hunt').onclick = () => set('hunt');
    document.getElementById('rest').onclick = () => set('rest');
    document.getElementById('idle').onclick = () => set('idle');
    setInterval(() => {
      if (state==='hunt') energy = Math.max(0, energy-3);
      if (state==='rest') energy = Math.min(100, energy+2);
      if (energy===0 && state==='hunt') { set('rest'); log.textContent='Energy empty — forced rest.'; }
      else if (energy===100 && state==='rest') { set('idle'); log.textContent='Full — back to idle.'; }
      else log.textContent = state==='hunt' ? 'Tracking…' : state==='rest' ? 'Recovering…' : 'Perched.';
      en.textContent = energy;
    }, 400);
  </script>
</body>
</html>
