<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loki life — Nicholas Lane</title>
  <link rel="icon" href="../favicon.svg">
  <link rel="stylesheet" href="../styles.css">
</head>
<body>
  <header><nav class="nav"><a class="brand" href="../index.html">NL</a><a href="loki.html">Loki</a></nav></header>
  <main>
    <p class="kicker">Browser stand-in</p>
    <h1>Loki on a desk</h1>
    <p class="lede">A tiny state machine so the portfolio has something to click if the board is not on the bench. Hunger and charge tick down. Feed or charge to keep it awake.</p>
    <div class="card">
      <p id="face" style="font-size:2rem;margin:0">o_o</p>
      <p id="stats"></p>
      <div class="row">
        <button class="btn" id="feed" type="button">Feed</button>
        <button class="btn ghost" id="charge" type="button">Charge</button>
      </div>
    </div>
  </main>
  <script>
    var hunger = 70, charge = 80;
    function tick() {
      hunger = Math.max(0, hunger - 4);
      charge = Math.max(0, charge - 3);
      var face = charge < 15 ? "x_x" : hunger < 25 ? ">_<" : "^_^";
      document.getElementById("face").textContent = face;
      document.getElementById("stats").textContent = "Hunger " + hunger + " · charge " + charge;
    }
    document.getElementById("feed").onclick = function () { hunger = Math.min(100, hunger + 25); tick(); };
    document.getElementById("charge").onclick = function () { charge = Math.min(100, charge + 30); tick(); };
    setInterval(tick, 1600);
    tick();
  </script>
</body>
</html>
