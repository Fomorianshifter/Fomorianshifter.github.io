<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loki life-cycle lab</title><link rel="stylesheet" href="../styles.css"></head>
<body>
<header><nav><strong>Nicholas Lane</strong><a href="../index.html">Portfolio</a> <a href="https://github.com/Fomorianshifter/Loki">Repo</a></nav>
<h1>Loki life cycle</h1>
<p class="lede">Browser stand-in for the companion in the Loki repo: egg, hatchling, juvenile, adult. The real project is C drivers for a Linux board, a TFT, and Flipper Zero UART.</p></header>
<main>
<p>Stage <strong id="stage">egg</strong> · hunger <span id="hunger">20</span> · mood <span id="mood">50</span></p>
<p><button id="feed">Feed</button> <button id="rest">Rest</button> <button id="tick">Advance hour</button></p>
<pre class="out" id="log">egg is warming.</pre>
</main>
<script>
const stages=["egg","hatchling","juvenile","adult"];
let i=0, hunger=20, mood=50, hours=0;
function paint(msg){stage.textContent=stages[i]; document.getElementById("hunger").textContent=hunger; document.getElementById("mood").textContent=mood; log.textContent=msg;}
feed.onclick=()=>{hunger=Math.max(0,hunger-25); mood=Math.min(100,mood+8); paint("fed");};
rest.onclick=()=>{mood=Math.min(100,mood+12); hunger=Math.min(100,hunger+4); paint("resting");};
tick.onclick=()=>{hours++; hunger=Math.min(100,hunger+7); mood=Math.max(0,mood-3); if(hours%4===0 && i<3 && hunger<70) i++; paint(stages[i]+" after "+hours+" h");};
</script>
</body></html>
