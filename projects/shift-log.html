<body>
<header>

  <nav><a href="../">Home</a><a href="../#labs">All projects</a><a href="https://github.com/Fomorianshifter">GitHub</a></nav>
</header>
<main class="wrap">
<p><a class="back" href="../">← portfolio</a></p>

<h1>Shift fault log</h1>
<p class="lede">Notes stay in this browser. Nothing is sent to a server.</p>
<div class="card">
  <label>Note <textarea id="note" rows="3" placeholder="Bay 3 conveyor VFD fault, reset, running"></textarea></label>
  <button class="btn" id="addnote">Add note</button>
  <ul class="clean" id="notes"></ul>
</div>
<script>
const notes = document.getElementById("notes");
function esc(s) { return s.replace(/[&<>]/g, c => ({"&":"&","<":"<",">":">"}[c])); }
function render() {
  const items = JSON.parse(localStorage.getItem("faults") || "[]");
  notes.innerHTML = items.map(n => "<li>" + esc(n) + "</li>").join("") || "<li>No notes yet.</li>";
}
document.getElementById("addnote").onclick = () => {
  const t = document.getElementById("note").value.trim();
  if (!t) return;
  const items = JSON.parse(localStorage.getItem("faults") || "[]");
  items.unshift(new Date().toLocaleString() + " — " + t);
  localStorage.setItem("faults", JSON.stringify(items.slice(0, 12)));
  document.getElementById("note").value = "";
  render();
};
render();
</script>
</main><footer>Nicholas Lane · nlane713@gmail.com · planning aids, not a jobsite procedure.</footer></body></html>
