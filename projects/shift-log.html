<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shift fault log — Nicholas Lane</title>
  <link rel="stylesheet" href="../styles.css">
</head>
<body>
  <header><a href="../index.html">Nicholas Lane</a><nav><a href="../index.html#labs">Labs</a></nav></header>
  <main>
    <p class="kicker">Lab</p>
    <h1>Shift fault log</h1>
    <p class="lede">Stays in this browser. Useful as a sample of how foundry call notes get written down.</p>
    <form class="panel" id="logform">
      <label>Area <input id="area" required value="Melt deck MCC"></label>
      <label>Note <textarea id="note" required rows="3">Intermittent overload on conveyor starter. Reset, logged for inspection.</textarea></label>
      <button class="primary" type="submit">Add to shift log</button>
    </form>
    <div class="log" id="log"></div>
  </main>
  <script>
    const key = "nl-shift-log";
    const log = document.getElementById("log");
    function load() { return JSON.parse(localStorage.getItem(key) || "[]"); }
    function paint() {
      log.innerHTML = load().map(row => "<div><strong>" + row.area + "</strong> · " + row.when + "<br>" + row.note + "</div>").join("") || "<p class='meta'>No entries yet.</p>";
    }
    document.getElementById("logform").onsubmit = (e) => {
      e.preventDefault();
      const rows = load();
      rows.unshift({ area: document.getElementById("area").value, note: document.getElementById("note").value, when: new Date().toLocaleString() });
      localStorage.setItem(key, JSON.stringify(rows.slice(0, 20)));
      paint();
    };
    paint();
  </script>
</body>
</html>
