<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shift fault log — Nicholas Lane</title>
<link rel="stylesheet" href="../styles.css">
</head>
<body>
<main>
<p><a href="../index.html">← Portfolio</a></p>
<h1>Shift fault log</h1>
<p class="note">Notes stay in this browser only. Nothing is uploaded.</p>
<div class="lab">
  <label>Asset <input id="asset" placeholder="Melt deck conveyor"></label>
  <label>Note <textarea id="note" rows="3" placeholder="Overload tripped after restart"></textarea></label>
  <button type="button" id="add">Add note</button>
  <ul id="list"></ul>
</div>
<script>
var key = "nl-fault-log";
function load() { try { return JSON.parse(localStorage.getItem(key) || "[]"); } catch (e) { return []; } }
function save(rows) { localStorage.setItem(key, JSON.stringify(rows)); }
function render() {
  var rows = load();
  var ul = document.getElementById("list");
  ul.innerHTML = "";
  if (!rows.length) { ul.innerHTML = "<li>No notes yet.</li>"; return; }
  rows.forEach(function (r) {
    var li = document.createElement("li");
    li.textContent = r.when + " · " + r.asset + " — " + r.note;
    ul.appendChild(li);
  });
}
document.getElementById("add").onclick = function () {
  var asset = document.getElementById("asset").value.trim() || "unspecified";
  var note = document.getElementById("note").value.trim();
  if (!note) return;
  var rows = load();
  rows.unshift({ when: new Date().toLocaleString(), asset: asset, note: note });
  save(rows.slice(0, 30));
  document.getElementById("note").value = "";
  render();
};
render();
</script>
</main>
</body>
</html>
