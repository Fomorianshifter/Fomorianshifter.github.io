<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>LOTO checklist — Nicholas Lane</title>
<link rel="stylesheet" href="../styles.css">
</head>
<body>
<main>
<p><a href="../index.html">← Portfolio</a></p>
<h1>LOTO checklist</h1>
<p class="note">Mock job only. Not a plant procedure. Follow the site energy-control program.</p>
<div class="lab" id="box"></div>
<p id="count"></p>
<script>
var steps = ["Notify affected people","Shut down with the normal stop","Isolate energy sources","Lock and tag","Verify zero energy"];
var box = document.getElementById("box");
steps.forEach(function (s) {
  var lab = document.createElement("label");
  lab.innerHTML = "<input type='checkbox'> " + s;
  box.appendChild(lab);
});
function count() {
  var n = box.querySelectorAll("input:checked").length;
  document.getElementById("count").textContent = n + " / " + steps.length;
}
box.addEventListener("change", count);
count();
</script>
</main>
</body>
</html>
