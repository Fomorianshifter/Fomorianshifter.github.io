<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>LOTO checklist — Nicholas Lane</title><link rel="stylesheet" href="../styles.css"/><link rel="icon" href="../favicon.svg"/></head>
<body><header class="nav"><div class="wrap"><a class="brand" href="../index.html">NL <span>//</span> LANE</a><nav><a href="../index.html#labs">Labs</a></nav></div></header>
<main class="wrap"><section class="hero"><p class="kicker">Training only · not a plant procedure</p><h1>Lockout / tagout checklist</h1><p class="lede">A memory aid for the order of steps before imaginary work. Real lockout follows the equipment procedure, energy sources, and your employer’s program.</p></section>
<section class="lab" id="list"></section><p class="out" id="status">0 of 7 complete — not clear to work</p></main>
<script>
var steps=["Notify affected people","Identify every energy source","Shut down with normal controls","Isolate each energy source","Apply your lock and tag","Release stored energy","Verify zero energy before work"];
var done=steps.map(function(){return false;});
var list=document.getElementById("list");
steps.forEach(function(s,i){
  var b=document.createElement("button"); b.className="ctrl"; b.textContent=(i+1)+". "+s;
  b.onclick=function(){ done[i]=!done[i]; render(); };
  b.id="s"+i; list.appendChild(b);
});
function render(){
  var n=done.filter(Boolean).length;
  steps.forEach(function(s,i){ var b=document.getElementById("s"+i); b.className="ctrl"+(done[i]?" on":""); b.textContent=(done[i]?"Done — ":"")+(i+1)+". "+s; });
  document.getElementById("status").textContent = n+" of 7 complete — "+(n===7?"training checklist complete":"not clear to work");
}
</script></body></html>
