<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wire aid — Nicholas Lane</title>
  <link rel="stylesheet" href="../styles.css">
</head>
<body>
  <header class="site"><div class="wrap nav"><a class="brand" href="../index.html"><span class="mark">NL</span> Nicholas Lane</a><ul><li><a href="../projects.html">Projects</a></li></ul></div></header>
  <main class="wrap">
    <section>
      <h1>Copper wire aid</h1>
      <p class="sub">A memory sheet for common 75°C copper ampacities used in study. Always use the NEC tables, terminal ratings, and bundling rules on a real job.</p>
      <div class="card">
        <label>Continuous load (A)</label>
        <input id="load" type="number" value="24" min="0">
        <p><button class="btn" type="button" id="go">Suggest</button></p>
        <p class="out" id="out"></p>
        <table>
          <thead><tr><th>AWG</th><th>Study ampacity</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script>
    const table = [[14,15],[12,20],[10,30],[8,50],[6,65],[4,85],[3,100],[2,115],[1,130]];
    rows.innerHTML = table.map(([a,b]) => `<tr><td>${a}</td><td>${b} A</td></tr>`).join("");
    document.getElementById("go").onclick = () => {
      const need = Number(load.value) * 1.25;
      const hit = table.find(([,amp]) => amp >= need);
      out.textContent = hit
        ? `125% of load is ${need.toFixed(1)} A. Smallest study size at or above that: ${hit[0]} AWG (${hit[1]} A).`
        : "Above this sheet. Look up larger conductors.";
    };
  </script>
</body>
</html>
