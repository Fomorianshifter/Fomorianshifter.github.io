<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Solar system demo</title>
  <link rel="stylesheet" href="../styles.css" />
</head>
<body>
  <header class="nav"><a class="brand" href="../">NL</a><nav><a href="../">Home</a></nav></header>
  <main>
    <p class="eyebrow">Demo</p>
    <h1>Solar system</h1>
    <canvas id="c" width="800" height="500"></canvas>
  </main>
  <script>
    const c = document.getElementById("c");
    const ctx = c.getContext("2d");
    const planets = [
      { r: 50, size: 4, speed: 0.028, color: "#b0b0b0" },
      { r: 80, size: 7, speed: 0.018, color: "#c9a66b" },
      { r: 115, size: 8, speed: 0.014, color: "#4ea3d9" },
      { r: 150, size: 6, speed: 0.011, color: "#d45a3c" },
      { r: 200, size: 14, speed: 0.006, color: "#d4b48a" }
    ];
    let t = 0;
    function draw() {
      ctx.fillStyle = "#07090b";
      ctx.fillRect(0, 0, c.width, c.height);
      const x = c.width / 2, y = c.height / 2;
      ctx.beginPath(); ctx.arc(x, y, 16, 0, Math.PI * 2);
      ctx.fillStyle = "#f2c14e"; ctx.fill();
      planets.forEach((p) => {
        ctx.beginPath(); ctx.arc(x, y, p.r, 0, Math.PI * 2);
        ctx.strokeStyle = "#223"; ctx.stroke();
        const a = t * p.speed;
        ctx.beginPath();
        ctx.arc(x + Math.cos(a) * p.r, y + Math.sin(a) * p.r, p.size, 0, Math.PI * 2);
        ctx.fillStyle = p.color; ctx.fill();
      });
      t += 1;
      requestAnimationFrame(draw);
    }
    draw();
  </script>
</body>
</html>
