<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Solar System demo — Nicholas Lane</title>
  <link rel="icon" href="../favicon.svg" />
  <link rel="stylesheet" href="../styles.css" />
</head>
<body>
  <header class="nav">
    <a class="brand" href="../index.html">NL<span>.</span></a>
    <nav>
      <a href="../index.html">Home</a>
      <a href="../projects.html" class="active">Projects</a>
      <a href="../resume.html">Resume</a>
    </nav>
  </header>
  <main>
    <p class="eyebrow">Canvas lab</p>
    <h1>Solar System</h1>
    <p class="lede">Rebuilt from <a href="https://github.com/Fomorianshifter/SolarSystem">SolarSystem</a>. Drag speed. Click to pause.</p>
    <label>Speed <input id="spd" type="range" min="0.2" max="4" step="0.1" value="1" /></label>
    <canvas class="stage" id="c" width="1100" height="420"></canvas>
  </main>
  <script>
    const c = document.getElementById('c'), ctx = c.getContext('2d');
    const planets = [
      { r: 40, s: 1.6, size: 4, color: '#c9a27a' },
      { r: 70, s: 1.2, size: 6, color: '#e8c36a' },
      { r: 105, s: 0.9, size: 7, color: '#5aa7ff' },
      { r: 140, s: 0.7, size: 5, color: '#d85b4a' },
      { r: 185, s: 0.4, size: 12, color: '#d4b48a' },
      { r: 230, s: 0.28, size: 10, color: '#e6d3a3' },
    ];
    let t = 0, run = true, mul = 1;
    document.getElementById('spd').oninput = e => mul = +e.target.value;
    c.onclick = () => run = !run;
    function frame() {
      const w = c.width, h = c.height, cx = w/2, cy = h/2;
      ctx.fillStyle = '#070b10'; ctx.fillRect(0,0,w,h);
      ctx.strokeStyle = '#1c2734';
      planets.forEach(p => { ctx.beginPath(); ctx.arc(cx,cy,p.r,0,Math.PI*2); ctx.stroke(); });
      ctx.fillStyle = '#ffcc55'; ctx.beginPath(); ctx.arc(cx,cy,14,0,Math.PI*2); ctx.fill();
      planets.forEach(p => {
        const a = t * p.s;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(cx + Math.cos(a)*p.r, cy + Math.sin(a)*p.r, p.size, 0, Math.PI*2);
        ctx.fill();
      });
      if (run) t += 0.012 * mul;
      requestAnimationFrame(frame);
    }
    frame();
  </script>
</body>
</html>
