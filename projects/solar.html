<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Solar system — Nicholas Lane</title>
  <link rel="stylesheet" href="../styles.css" />
</head>
<body>
  <div class="wrap">
    <header class="nav">
      <a class="brand" href="../index.html">NICHOLAS LANE</a>
      <nav><a href="../projects.html">Projects</a></nav>
    </header>
    <section class="hero">
      <p class="kicker">From early SolarSystem GitHub work</p>
      <h1>Orbits</h1>
    </section>
    <canvas id="c" width="900" height="520"></canvas>
  </div>
  <script>
    const c = document.getElementById("c"), x = c.getContext("2d");
    const planets = [
      { r: 40, s: 0.028, size: 4, color: "#c4c4c4" },
      { r: 62, s: 0.022, size: 6, color: "#e8c27a" },
      { r: 88, s: 0.018, size: 7, color: "#4ea3ff" },
      { r: 114, s: 0.014, size: 5, color: "#ff6b4a" },
      { r: 150, s: 0.008, size: 12, color: "#d9b48a" }
    ];
    let t = 0;
    function draw() {
      x.fillStyle = "#070b10"; x.fillRect(0,0,c.width,c.height);
      const cx = c.width/2, cy = c.height/2;
      x.fillStyle = "#f0b429"; x.beginPath(); x.arc(cx,cy,14,0,Math.PI*2); x.fill();
      planets.forEach(p => {
        x.strokeStyle = "#243041"; x.beginPath(); x.arc(cx,cy,p.r,0,Math.PI*2); x.stroke();
        const a = t * p.s;
        x.fillStyle = p.color; x.beginPath();
        x.arc(cx + Math.cos(a)*p.r, cy + Math.sin(a)*p.r, p.size, 0, Math.PI*2); x.fill();
      });
      t++; requestAnimationFrame(draw);
    }
    draw();
  </script>
</body>
</html>
