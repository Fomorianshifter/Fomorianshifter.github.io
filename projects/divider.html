<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>Voltage divider — Nicholas Lane</title><link rel="stylesheet" href="../styles.css"/><link rel="icon" href="../favicon.svg"/></head>
<body><header class="nav"><div class="wrap"><a class="brand" href="../index.html">NL <span>//</span> LANE</a><nav><a href="starter.html">Starter</a><a href="orbit.html">Orbit</a></nav></div></header>
<main class="wrap"><section class="hero"><p class="kicker">Circuit lab</p><h1>Voltage divider</h1><p class="lede">Vout = Vin × R2 / (R1 + R2). Handy when a sensor or analog input needs a lower voltage than the source.</p></section>
<section class="lab">
<label>Vin <span id="vinL">12</span> V <input id="vin" type="range" min="1" max="24" value="12"/></label>
<label>R1 <span id="r1L">1000</span> Ω <input id="r1" type="range" min="100" max="10000" step="100" value="1000"/></label>
<label>R2 <span id="r2L">1000</span> Ω <input id="r2" type="range" min="100" max="10000" step="100" value="1000"/></label>
<p class="out" id="out"></p>
</section></main>
<script>
function calc(){
  var vin=+document.getElementById("vin").value, r1=+document.getElementById("r1").value, r2=+document.getElementById("r2").value;
  document.getElementById("vinL").textContent=vin;
  document.getElementById("r1L").textContent=r1;
  document.getElementById("r2L").textContent=r2;
  var vout = vin * r2 / (r1 + r2);
  document.getElementById("out").textContent = "Vout = " + vout.toFixed(2) + " V   ·   I = " + ((vin/(r1+r2))*1000).toFixed(2) + " mA";
}
["vin","r1","r2"].forEach(function(id){ document.getElementById(id).oninput=calc; });
calc();
</script></body></html>
