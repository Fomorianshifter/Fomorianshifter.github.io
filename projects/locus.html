<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Locus — Nicholas Lane</title>
  <link rel="stylesheet" href="../styles.css" />
</head>
<body>
  <div class="wrap">
    <header class="nav">
      <a class="brand" href="../index.html">NICHOLAS LANE</a>
      <nav><a href="../projects.html">Projects</a></nav>
    </header>
    <section class="hero">
      <p class="kicker">Function grapher</p>
      <h1>Locus</h1>
      <p class="lede">Scroll to zoom. Drag to pan. Cursor shows x, y.</p>
    </section>
    <p class="status" id="readout">x=0.00  y=0.00</p>
    <canvas id="c" width="900" height="520"></canvas>
  </div>
  <script>
    const c = document.getElementById("c"), g = c.getContext("2d");
    let scale = 40, ox = c.width/2, oy = c.height/2, drag=false, lx=0, ly=0;
    const fn = x => Math.sin(x) + 0.35*Math.sin(3*x);
    function world(px,py){ return { x:(px-ox)/scale, y:(oy-py)/scale }; }
    function draw() {
      g.fillStyle="#070b10"; g.fillRect(0,0,c.width,c.height);
      g.strokeStyle="#1a2430"; g.beginPath();
      for(let x=ox%scale; x<c.width; x+=scale){ g.moveTo(x,0); g.lineTo(x,c.height); }
      for(let y=oy%scale; y<c.height; y+=scale){ g.moveTo(0,y); g.lineTo(c.width,y); }
      g.stroke();
      g.strokeStyle="#3ee0a8"; g.lineWidth=2; g.beginPath();
      for(let px=0; px<c.width; px++){
        const x = (px-ox)/scale, y = fn(x), py = oy - y*scale;
        if(px===0) g.moveTo(px,py); else g.lineTo(px,py);
      }
      g.stroke(); g.lineWidth=1;
    }
    c.addEventListener("wheel", e => { e.preventDefault(); scale *= e.deltaY<0?1.1:0.9; scale=Math.max(12,Math.min(140,scale)); draw(); }, {passive:false});
    c.addEventListener("mousedown", e => { drag=true; lx=e.offsetX; ly=e.offsetY; });
    window.addEventListener("mouseup", () => drag=false);
    c.addEventListener("mousemove", e => {
      const w = world(e.offsetX, e.offsetY);
      document.getElementById("readout").textContent = `x=${w.x.toFixed(2)}  y=${w.y.toFixed(2)}`;
      if(drag){ ox += e.offsetX-lx; oy += e.offsetY-ly; lx=e.offsetX; ly=e.offsetY; draw(); }
    });
    draw();
  </script>
</body>
</html>
