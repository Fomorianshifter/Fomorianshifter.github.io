<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coordinate lab — Nicholas Lane</title><link rel="stylesheet" href="../styles.css"></head>
<body><header><nav><a href="../index.html">Home</a></nav><h1>Coordinate log</h1>
<p class="meta">Browser stand-in for GhostGPS. Points stay on this page. Distance uses a flat approximation.</p></header>
<main class="card">
<label>Label<input id="label" value="panel"></label>
<label>Latitude<input id="lat" type="number" step="0.0001" value="44.5133"></label>
<label>Longitude<input id="lon" type="number" step="0.0001" value="-88.0133"></label>
<button type="button" id="add">Add point</button>
<p id="out"></p>
</main>
<script>
const pts=[];
document.getElementById('add').onclick=()=>{
  pts.push({label:label.value, lat:+lat.value, lon:+lon.value});
  let text=pts.map(p=>p.label+': '+p.lat+', '+p.lon).join('\n');
  if(pts.length>1){
    const a=pts.at(-2), b=pts.at(-1);
    const miles=Math.hypot((b.lat-a.lat)*69, (b.lon-a.lon)*69*Math.cos(a.lat*Math.PI/180));
    text+='\nLast leg about '+miles.toFixed(2)+' miles.';
  }
  out.textContent=text;
};
</script></body></html>
