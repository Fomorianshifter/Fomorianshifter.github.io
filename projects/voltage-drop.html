<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Voltage drop — Nicholas Lane</title>
  <link rel="stylesheet" href="../styles.css">
</head>
<body>
  <header><div class="wrap"><nav><a class="brand" href="../index.html">Nicholas Lane</a><div class="links"><a href="../index.html#projects">Projects</a></div></nav></div></header>
  <main class="wrap">
    <section class="hero">
      <div class="kicker">Portfolio lab</div>
      <h1>Single-phase voltage drop</h1>
      <p class="lede">Approximate copper drop using VD = 2 × K × I × D / cmil, with K = 12.9. One-way distance. This is a study tool, not an NEC permit calculation.</p>
    </section>
    <section class="panel">
      <div class="row">
        <div><label for="volts">Source voltage</label><input id="volts" type="number" value="120" min="1"></div>
        <div><label for="amps">Load amps</label><input id="amps" type="number" value="16" min="0" step="0.1"></div>
        <div><label for="feet">One-way feet</label><input id="feet" type="number" value="80" min="0"></div>
        <div>
          <label for="awg">Copper AWG</label>
          <select id="awg">
            <option value="4107">14</option>
            <option value="6530" selected>12</option>
            <option value="10380">10</option>
            <option value="16510">8</option>
            <option value="26240">6</option>
            <option value="41740">4</option>
            <option value="66360">2</option>
          </select>
        </div>
      </div>
      <p class="out" id="drop">—</p>
      <p class="meta" id="note"></p>
    </section>
  </main>
  <script>
    const volts = document.getElementById("volts");
    const amps = document.getElementById("amps");
    const feet = document.getElementById("feet");
    const awg = document.getElementById("awg");
    const drop = document.getElementById("drop");
    const note = document.getElementById("note");
    function calc() {
      const v = Number(volts.value);
      const i = Number(amps.value);
      const d = Number(feet.value);
      const cmil = Number(awg.value);
      const vd = (2 * 12.9 * i * d) / cmil;
      const pct = v ? (vd / v) * 100 : 0;
      drop.textContent = vd.toFixed(2) + " V  ·  " + pct.toFixed(2) + "%";
      note.textContent = pct > 3
        ? "Over a common 3% branch-circuit study limit. Try a larger conductor or a shorter run."
        : "At or under a common 3% branch-circuit study limit for these inputs.";
      note.className = pct > 3 ? "warn" : "meta";
    }
    [volts, amps, feet, awg].forEach((el) => el.addEventListener("input", calc));
    calc();
  </script>
</body>
</html>
