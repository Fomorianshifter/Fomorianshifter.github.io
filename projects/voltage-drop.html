<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voltage drop aid — Nicholas Lane</title><link rel="stylesheet" href="../styles.css"></head>
<body><header class="site"><div class="wrap"><a class="brand" href="../index.html">Nicholas Lane</a><nav><a href="../index.html">Home</a></nav></div></header>
<main class="wrap"><section class="hero"><p class="kicker">Project · electrical</p><h1>Single-phase voltage drop</h1>
<p class="lede">Estimate using VD = 2 x K x I x D / CM, with K = 12.9 for copper. Circular mils are approximate. Not a substitute for the NEC or a stamped design.</p>
<div class="card">
<label>Voltage</label><input id="v" type="number" value="240">
<label>Load amps</label><input id="i" type="number" value="20">
<label>One-way length, feet</label><input id="d" type="number" value="100">
<label>Copper conductor</label>
<select id="awg"><option value="10380">14 AWG</option><option value="16510" selected>12 AWG</option><option value="26240">10 AWG</option><option value="41740">8 AWG</option><option value="66360">6 AWG</option></select>
<p class="out" id="out"></p>
</div></section></main>
<script>
function calc(){
  const v = +document.getElementById("v").value, i = +document.getElementById("i").value, d = +document.getElementById("d").value, cm = +document.getElementById("awg").value;
  const vd = (2 * 12.9 * i * d) / cm, pct = v ? (vd / v) * 100 : 0;
  const el = document.getElementById("out");
  el.textContent = vd.toFixed(2) + " V drop (" + pct.toFixed(2) + "%). Receiving about " + (v - vd).toFixed(1) + " V.";
  el.className = pct > 3 ? "out warn" : "out ok";
}
document.querySelectorAll("input,select").forEach(el => el.addEventListener("input", calc));
calc();
</script></body></html>
