<h1>Voltage drop</h1>
<p class="lede">Single-phase copper estimate: drop = 2 × amps × ohms-per-kft × feet / 1000. Check NEC Chapter 9 tables before you buy wire.</p>
<div class="card">
  <label>Load amps <input id="amps" type="number" value="20" min="1"></label>
  <label>One-way feet <input id="feet" type="number" value="100" min="1"></label>
  <label>AWG <select id="awg"><option value="12">12</option><option value="10">10</option><option value="8">8</option><option value="6">6</option></select></label>
  <label>Volts <input id="volts" type="number" value="240" min="1"></label>
  <p class="stat" id="vd"></p>
</div>
<script>
const ohms = {12: 1.98, 10: 1.24, 8: 0.778, 6: 0.491};
function vd() {
  const a = +amps.value, ft = +feet.value, v = +volts.value, r = ohms[awg.value];
  const drop = 2 * a * r * ft / 1000;
  const pct = v ? drop / v * 100 : 0;
  document.getElementById("vd").textContent = drop.toFixed(2) + " V drop · " + pct.toFixed(2) + "% of " + v + " V";
}
["amps","feet","awg","volts"].forEach(id => document.getElementById(id).addEventListener("input", vd));
vd();
</script>
