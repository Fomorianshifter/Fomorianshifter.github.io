<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Voltage drop — Nicholas Lane</title><link rel="icon" href="../favicon.svg"><link rel="stylesheet" href="../styles.css"></head>
<body><header><nav class="nav"><a class="brand" href="../index.html">NL</a><a href="../projects.html">Projects</a></nav></header>
<main><p class="kicker">Field tool</p><h1>Single-phase voltage drop</h1>
<p class="lede">Approximate copper drop: 2 × 12.9 × amps × one-way feet ÷ circular mils. A field check, not an NEC substitute.</p>
<form id="vd"><label>Load amps <input id="amps" type="number" min="0" step="0.1" value="16"></label>
<label>One-way length, feet <input id="feet" type="number" min="0" step="1" value="80"></label>
<label>Source volts <input id="volts" type="number" min="1" step="1" value="120"></label>
<label>AWG copper <select id="awg"></select></label>
<p><button class="primary" type="submit">Calculate</button></p></form>
<p class="out" id="out">—</p><p id="note"></p>
<footer><a href="../projects.html">Back to projects</a></footer></main>
<script>
const cm={"14":4110,"12":6530,"10":10380,"8":16510,"6":26240,"4":41740};
document.getElementById("awg").innerHTML=Object.entries(cm).map(([awg,value])=>`<option value="${value}" ${awg==="12"?"selected":""}>${awg}</option>`).join("");
document.getElementById("vd").addEventListener("submit",(event)=>{
event.preventDefault();
const amps=Number(document.getElementById("amps").value);
const feet=Number(document.getElementById("feet").value);
const volts=Number(document.getElementById("volts").value);
const circular=Number(document.getElementById("awg").value);
const drop=(2*12.9*amps*feet)/circular;
const pct=volts?(drop/volts)*100:0;
const out=document.getElementById("out");
out.textContent=`${drop.toFixed(2)} V · ${pct.toFixed(1)}%`;
out.className="out "+(pct>5?"bad":"ok");
document.getElementById("note").textContent=pct>5?"Over 5% on this approximation. Look at a larger conductor or a shorter run before treating it as acceptable.":"At or under 5% on this approximation. Still confirm with the job spec and the code table that applies.";
});
</script></body></html>
