<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Voltage drop</title><style>body{margin:0;font-family:sans-serif;background:#16130f;color:#f4efe6}main{padding:14px}label{display:block;margin:8px 0}input,select{font:inherit;background:#241f1a;color:#f4efe6;border:1px solid #3c342b;border-radius:8px;padding:6px}output{display:block;margin-top:12px;font-size:20px}</style></head><body><main><label>One-way length, feet <input id="feet" type="number" value="120" min="1"></label><label>Load, amps <input id="amps" type="number" value="16" min="0" step="0.1"></label><label>Source, volts <input id="volts" type="number" value="120" min="1"></label><label>Copper AWG <select id="awg"><option value="1.59">14</option><option value="1.00" selected>12</option><option value="0.628">10</option><option value="0.395">8</option><option value="0.249">6</option></select></label><output id="out"></output><p>Approximate round-trip drop using ohms per 1,000 feet. Check the NEC chapter 9 tables before you pull wire.</p></main><script>function calc(){const roundTrip=feet.value*2/1000*Number(awg.value);const drop=amps.value*roundTrip;const pct=volts.value?(drop/volts.value)*100:0;out.textContent=drop.toFixed(2)+" V  ·  "+pct.toFixed(1)+"%";}document.querySelectorAll("input,select").forEach(el=>el.addEventListener("input",calc));calc();</script></body></html>
