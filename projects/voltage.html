<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voltage drop lab</title><link rel="stylesheet" href="../styles.css"></head>
<body>
<header><nav><strong>Nicholas Lane</strong><a href="../index.html">Portfolio</a></nav>
<h1>Single-phase voltage drop</h1>
<p class="lede">Estimate only, using copper ohms per thousand feet. Not a design calculation and not a substitute for the NEC.</p></header>
<main>
<label>Load amps <input id="amps" type="number" value="16" min="0" step="0.1"></label>
<label>One-way length, feet <input id="feet" type="number" value="80" min="0"></label>
<label>Voltage <input id="volts" type="number" value="120"></label>
<label>Copper AWG
<select id="awg">
<option value="1.21">14 (1.21 ohm/kft)</option>
<option value="0.764" selected>12 (0.764)</option>
<option value="0.481">10 (0.481)</option>
<option value="0.304">8 (0.304)</option>
<option value="0.192">6 (0.192)</option>
<option value="0.120">4 (0.120)</option>
</select></label>
<p class="out" id="out"></p>
</main>
<script>
function calc(){
  const I=+amps.value, L=+feet.value, V=+volts.value, r=+awg.value;
  const drop=2*I*r*L/1000, pct=V?drop/V*100:0;
  out.textContent=`Drop ${drop.toFixed(2)} V  (${pct.toFixed(2)}%)\nEnd voltage ${(V-drop).toFixed(1)} V\nVD = 2 x I x R x L / 1000`;
}
["amps","feet","volts","awg"].forEach(id=>document.getElementById(id).oninput=calc);
calc();
</script>
</body></html>
