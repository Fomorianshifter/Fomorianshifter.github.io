<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Voltage drop — Nicholas Lane</title>
  <link rel="stylesheet" href="../styles.css" />
</head>
<body>
  <header class="top"><a class="mark" href="../index.html">NL</a><nav><a href="../index.html">Home</a></nav></header>
  <main>
    <h1>Voltage drop</h1>
    <p class="note">Single-phase copper estimate: VD = 2 × K × I × L / CM, with K = 12.9. Study tool, not an NEC check.</p>
    <label>Load amps <input id="amps" type="number" value="16" min="0" step="0.1" /></label>
    <label>One-way length, feet <input id="feet" type="number" value="120" min="0" /></label>
    <label>Copper circular mils
      <select id="cm">
        <option value="6530">14 AWG · 6530</option>
        <option value="10380" selected>12 AWG · 10380</option>
        <option value="16510">10 AWG · 16510</option>
        <option value="26240">8 AWG · 26240</option>
        <option value="41740">6 AWG · 41740</option>
      </select>
    </label>
    <label>Source volts <input id="volts" type="number" value="120" min="1" /></label>
    <p class="out" id="out"></p>
  </main>
  <script>
    const K = 12.9;
    function calc() {
      const I = Number(amps.value), L = Number(feet.value), CM = Number(cm.value), V = Number(volts.value);
      const drop = (2 * K * I * L) / CM;
      const pct = V ? (drop / V) * 100 : 0;
      out.textContent = drop.toFixed(2) + " V drop · " + pct.toFixed(1) + "% of source";
    }
    for (const id of ["amps", "feet", "cm", "volts"]) document.getElementById(id).addEventListener("input", calc);
    calc();
  </script>
</body>
</html>
