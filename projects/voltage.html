<main><div class="kicker">Field tool</div><h1>Voltage drop</h1><p class="lede">Single-phase copper estimate: VD = 2 x I x R x distance / 1000. 3 percent is a common branch-circuit target, not a code citation.</p><div class="card"><label>Volts <input id="v" type="number" value="480"></label><label>Amps <input id="a" type="number" value="20"></label><label>One-way feet <input id="ft" type="number" value="150"></label><label>Ohms per 1000 ft <input id="ohm" type="number" value="0.491" step="0.001"></label><p class="out" id="vdrop"></p><p>12 AWG copper is about 1.98 ohm/kft, 10 AWG about 1.24, 8 AWG about 0.778, 6 AWG about 0.491.</p></div><p><a href="https://github.com/Fomorianshifter">GitHub</a></p></main>
