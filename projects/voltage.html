<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Voltage drop — Nicholas Lane</title>
  <link rel="stylesheet" href="../styles.css" />
</head>
<body>
  <header class="top"><a class="mark" href="../index.html">NL</a><nav><a href="../index.html#labs">Projects</a></nav></header>
  <main class="lab">
    <h1>Voltage drop</h1>
    <p>Single-phase copper estimate: VD = 2 × K × I × D / CM. K is 12.9 for copper. This is a study tool, not an NEC stamp.</p>
    <form class="panel" id="form">
      <label>Load amps <input id="amps" type="number" min="0" step="0.1" value="20" /></label>
      <label>One-way length, feet <input id="feet" type="number" min="0" step="1" value="80" /></label>
      <label>Conductor
        <select id="cm">
          <option value="6530">14 AWG (6530 cm)</option>
          <option value="10380" selected>12 AWG (10380 cm)</option>
          <option value="16510">10 AWG (16510 cm)</option>
          <option value="26240">8 AWG (26240 cm)</option>
          <option value="41740">6 AWG (41740 cm)</option>
        </select>
      </label>
      <label>Source volts <input id="volts" type="number" min="1" step="1" value="120" /></label>
      <button type="submit">Estimate</button>
      <p class="result" id="out">—</p>
    </form>
  </main>
  <script>
    document.getElementById("form").addEventListener("submit", (e) => {
      e.preventDefault();
      const I = Number(document.getElementById("amps").value);
      const D = Number(document.getElementById("feet").value);
      const CM = Number(document.getElementById("cm").value);
      const V = Number(document.getElementById("volts").value);
      const vd = (2 * 12.9 * I * D) / CM;
      const pct = V ? (vd / V) * 100 : 0;
      document.getElementById("out").textContent = vd.toFixed(2) + " V drop · " + pct.toFixed(1) + "% of " + V + " V";
    });
  </script>
</body>
</html>
