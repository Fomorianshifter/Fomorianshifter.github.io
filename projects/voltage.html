<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Voltage drop lab</title><link rel="stylesheet" href="../styles.css"></head>
<body><header><a href="../index.html">Nicholas Lane</a><nav><a href="../index.html#labs">Labs</a></nav></header>
<main class="wrap"><section class="hero"><div class="kicker">Study tool</div><h1>Single-phase copper voltage drop</h1>
<p class="lede">VD = 2 × K × I × D / CM, with K = 12.9 for copper. One-way distance in feet. A field estimate for learning, not a code stamp.</p>
<form class="card" id="form">
<label>Load current (A) <input id="amps" type="number" value="20" min="0" step="0.1"></label>
<label>One-way length (ft) <input id="feet" type="number" value="100" min="0" step="1"></label>
<label>Conductor <select id="wire">
<option value="4107">14 AWG (4,107 cmil)</option>
<option value="6530">12 AWG (6,530 cmil)</option>
<option value="10380" selected>10 AWG (10,380 cmil)</option>
<option value="16510">8 AWG (16,510 cmil)</option>
<option value="26240">6 AWG (26,240 cmil)</option>
</select></label>
<label>Source voltage <input id="volts" type="number" value="120" min="1"></label>
<button class="tap" type="submit">Calculate</button>
<div class="out" id="out">Enter values and calculate.</div>
</form></section></main>
<script>
document.getElementById("form").addEventListener("submit", function (e) {
  e.preventDefault();
  var i = Number(document.getElementById("amps").value);
  var d = Number(document.getElementById("feet").value);
  var cm = Number(document.getElementById("wire").value);
  var v = Number(document.getElementById("volts").value);
  var vd = (2 * 12.9 * i * d) / cm;
  var pct = v ? (vd / v) * 100 : 0;
  var flag = pct > 3 ? "Above a common 3% branch-circuit target." : "At or under a common 3% branch-circuit target.";
  document.getElementById("out").textContent = vd.toFixed(2) + " V drop (" + pct.toFixed(2) + "% of " + v + " V). " + flag;
});
</script></body></html>
