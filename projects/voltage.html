<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voltage drop — Nicholas Lane</title>
<link rel="stylesheet" href="../styles.css">
</head>
<body>
<main>
<p><a href="../index.html">← Portfolio</a></p>
<h1>Voltage drop</h1>
<p class="note">Single-phase copper estimate. K = 12.9. Confirm with NEC tables before you pull wire.</p>
<div class="lab">
  <label>Load amps <input id="amps" type="number" value="16" min="0" step="0.1"></label>
  <label>One-way length, feet <input id="feet" type="number" value="80" min="0"></label>
  <label>Voltage <input id="volts" type="number" value="240" min="1"></label>
  <label>AWG
    <select id="awg">
      <option value="14">14</option>
      <option value="12" selected>12</option>
      <option value="10">10</option>
      <option value="8">8</option>
      <option value="6">6</option>
    </select>
  </label>
  <p class="out" id="out"></p>
</div>
<script>
var cm = {14:4110, 12:6530, 10:10380, 8:16510, 6:26240};
function calc() {
  var i = +document.getElementById("amps").value;
  var l = +document.getElementById("feet").value;
  var v = +document.getElementById("volts").value;
  var a = document.getElementById("awg").value;
  var drop = (2 * 12.9 * i * l) / cm[a];
  var pct = v ? (drop / v) * 100 : 0;
  document.getElementById("out").textContent = drop.toFixed(2) + " V drop · " + pct.toFixed(2) + "% of " + v + " V";
}
["amps","feet","volts","awg"].forEach(function (id) {
  document.getElementById(id).addEventListener("input", calc);
});
calc();
</script>
</main>
</body>
</html>
