<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Panel calculator — Nicholas Lane</title>
  <link rel="icon" href="../favicon.svg" />
  <link rel="stylesheet" href="../styles.css" />
</head>
<body>
  <header class="nav">
    <a class="brand" href="../index.html">NL<span>.</span></a>
    <nav>
      <a href="../index.html">Home</a>
      <a href="../projects.html" class="active">Projects</a>
      <a href="../resume.html">Resume</a>
    </nav>
  </header>
  <main>
    <p class="eyebrow">Electrical math</p>
    <h1>Panel / circuit calculator</h1>
    <p class="lede">Single-phase snapshot: watts, amps, and the 80% continuous-load check against a breaker rating.</p>
    <p>
      <label>Volts <input id="v" type="number" value="120" /></label>
      <label>Watts <input id="w" type="number" value="1440" /></label>
      <label>Breaker A <input id="b" type="number" value="20" /></label>
    </p>
    <article class="card" id="out"></article>
  </main>
  <script>
    const v=document.getElementById('v'), w=document.getElementById('w'), b=document.getElementById('b'), out=document.getElementById('out');
    function calc() {
      const volts=+v.value||0, watts=+w.value||0, br=+b.value||0;
      const amps = volts ? watts/volts : 0;
      const allow = br * 0.8;
      const ok = amps <= allow;
      out.innerHTML = '<p><strong>'+amps.toFixed(2)+' A</strong> at '+volts+' V</p>' +
        '<p>80% of '+br+' A breaker = '+allow.toFixed(1)+' A continuous</p>' +
        '<p class="'+(ok?'coil on':'coil off')+'">'+(ok?'Within continuous rating':'Over 80% — resize or split load')+'</p>';
    }
    [v,w,b].forEach(el => el.oninput = calc);
    calc();
  </script>
</body>
</html>
