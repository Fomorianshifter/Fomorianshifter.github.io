<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Motor load estimator</title>
  <link rel="stylesheet" href="../styles.css" />
</head>
<body>
  <header class="nav"><a class="brand" href="../">NL</a><nav><a href="../">Home</a></nav></header>
  <main>
    <p class="eyebrow">Field tool</p>
    <h1>Three-phase motor FLA helper</h1>
    <p>Estimate only. Check the nameplate and the NEC before you pull wire.</p>
    <label>Horsepower</label>
    <input id="hp" type="number" value="10" min="0.25" step="0.25" />
    <label>Voltage</label>
    <select id="v"><option>208</option><option selected>480</option><option>240</option><option>600</option></select>
    <label>Efficiency</label>
    <input id="eff" type="number" value="0.9" min="0.5" max="1" step="0.01" />
    <label>Power factor</label>
    <input id="pf" type="number" value="0.85" min="0.5" max="1" step="0.01" />
    <p class="result" id="out"></p>
  </main>
  <script>
    const hpEl = document.getElementById('hp');
    const vEl = document.getElementById('v');
    const effEl = document.getElementById('eff');
    const pfEl = document.getElementById('pf');
    const out = document.getElementById('out');
    function calc() {
      const fla = ( +hpEl.value * 746) / (Math.sqrt(3) * +vEl.value * +effEl.value * +pfEl.value);
      const cond = fla < 20 ? '12 AWG copper is often in the conversation' : fla < 30 ? '10 AWG copper is often in the conversation' : fla < 50 ? '8 AWG copper is often in the conversation' : 'Size from the NEC tables';
      out.textContent = 'About ' + fla.toFixed(1) + ' A FLA. ' + cond + '.';
    }
    [hpEl, vEl, effEl, pfEl].forEach((el) => el.addEventListener('input', calc));
    calc();
  </script>
</body>
</html>
