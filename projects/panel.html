<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Motor Control Panel</title><link rel="stylesheet" href="../styles.css" /></head>
<body><div class="wrap"><header class="nav"><div class="brand"><a href="../index.html">NICHOLAS LANE</a></div><nav><a href="../projects.html">Projects</a></nav></header>
<div class="kicker">Live demo</div><h1>Motor control panel</h1>
<div class="demo-stage"><p>Selector</p><div class="hoa"><button id="hand">HAND</button><button id="off" class="active">OFF</button><button id="auto">AUTO</button></div>
<p style="margin-top:18px">Protection</p><button id="ol">Simulate overload</button> <button id="reset">Reset OL</button>
<p style="margin-top:18px">Motor <span id="motor" class="lamp"></span> Overload <span id="trip" class="lamp"></span></p>
<p class="meta" id="status">OFF</p></div>
<script>
let mode="off", ol=false, permit=true;
const motor=document.getElementById("motor"), trip=document.getElementById("trip"), status=document.getElementById("status");
function setMode(m){mode=m;["hand","off","auto"].forEach(id=>document.getElementById(id).classList.toggle("active",id===m));render();}
function render(){const run=!ol&&(mode==="hand"||(mode==="auto"&&permit));motor.className="lamp"+(run?" on":"");trip.className="lamp"+(ol?" trip":"");status.textContent=ol?"TRIP. Reset required.":run?(mode==="hand"?"HAND. Motor running.":"AUTO. Motor running."):"OFF. Contactor open.";}
document.getElementById("hand").onclick=()=>setMode("hand");
document.getElementById("off").onclick=()=>setMode("off");
document.getElementById("auto").onclick=()=>setMode("auto");
document.getElementById("ol").onclick=()=>{ol=true;render();};
document.getElementById("reset").onclick=()=>{ol=false;render();};
render();
</script></div></body></html>
