<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Panel log — Nicholas Lane</title>
  <link rel="stylesheet" href="../styles.css" />
</head>
<body>
  <header>
    <a class="mark" href="../index.html">Nicholas Lane</a>
    <nav><a href="../index.html">Home</a><a href="orbits.html">Orbits</a><a href="loki.html">Loki</a></nav>
  </header>
  <main>
    <p class="kicker">Lab · electrical maintenance</p>
    <h1>Panel fault log</h1>
    <p class="lede">Log a call, set priority, and keep a shift count. Entries stay in this browser only.</p>
    <form class="panel" id="form">
      <div class="row">
        <input name="area" placeholder="Area, e.g. melt deck MCC-2" required />
        <select name="priority">
          <option>Low</option><option selected>Medium</option><option>High</option>
        </select>
        <input name="note" placeholder="What failed" required />
        <button class="plain" type="submit">Add</button>
      </div>
    </form>
    <p class="meta" id="count"></p>
    <table>
      <thead><tr><th>When</th><th>Area</th><th>Priority</th><th>Note</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </main>
  <script>
    const key = "nl-panel-log";
    const rows = document.querySelector("#rows");
    const count = document.querySelector("#count");
    function load() { return JSON.parse(localStorage.getItem(key) || "[]"); }
    function paint() {
      const items = load();
      rows.innerHTML = items.map(i => `<tr><td>${i.when}</td><td>${i.area}</td><td>${i.priority}</td><td>${i.note}</td></tr>`).join("");
      count.textContent = items.length + " open notes this browser";
    }
    document.querySelector("#form").addEventListener("submit", (e) => {
      e.preventDefault();
      const data = new FormData(e.target);
      const items = load();
      items.unshift({
        when: new Date().toLocaleString(),
        area: data.get("area"),
        priority: data.get("priority"),
        note: data.get("note")
      });
      localStorage.setItem(key, JSON.stringify(items.slice(0, 20)));
      e.target.reset();
      paint();
    });
    paint();
  </script>
</body>
</html>
